                            <div className="border-b border-slate-700 pb-2"><div className="flex justify-between text-sm"><span className="text-cyan-300 font-semibold">Scope 2 (Loc)</span><span className="font-bold">{fmt(calc.scope2_loc)} t</span></div><div className="flex justify-between text-sm"><span className="text-cyan-300 font-semibold">Scope 2 (Mkt)</span><span className="font-bold text-cyan-200">{fmt(calc.scope2_mkt)} t</span></div></div>
                            <div className="border-b border-slate-700 pb-2"><div className="flex justify-between text-sm"><span className="text-indigo-300 font-semibold">Scope 3</span><span className="font-bold">{fmt(calc.scope3_tot)} t</span></div></div>
                        </div>
                        <div className="bg-blue-600 p-4 rounded-lg text-center"><p className="text-[10px] uppercase font-bold tracking-wider mb-1 opacity-90">Totale GHG (Mkt)</p><p className="text-3xl font-black">{fmt(calc.ghgTotalMkt)}</p></div>
                    </div>
                </div>
            );
        };

        const ModuleB4 = ({ d, upd }) => (
            <div className="space-y-6">
                <Select label={<>L'azienda svolge attività produttive, agricole o industriali con impatti materiali sull'inquinamento? <InfoButton topic="b4" /></>} value={d.isMaterial} options={['Sì', 'No']} onChange={v=>upd('isMaterial', v)} />
                {d.isMaterial === 'No' && <div className="p-4 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg flex gap-3"><CheckCircle2 size={20} className="shrink-0 mt-0.5"/><p className="text-sm">In quanto azienda nel settore servizi/uffici, l'inquinamento non è considerato materiale (Par. 69).</p></div>}
                {d.isMaterial === 'Sì' && (
                    <div className="animate-fadeIn space-y-6 border-t border-slate-200 pt-6">
                        <Select label="I dati sulle emissioni inquinanti sono già di pubblico dominio (es. EMAS)?" value={d.isDataPublic} options={['Sì', 'No']} onChange={v=>upd('isDataPublic', v)} />
                        {d.isDataPublic === 'Sì' && <div className="bg-blue-50 p-4 border border-blue-100 rounded-lg"><Input label="URL / Link Pubblico" type="text" value={d.pollutantsUrl} onChange={v=>upd('pollutantsUrl', v)} placeholder="www.sito.it/emas..." /></div>}
                        {d.isDataPublic === 'No' && <PollutantsManager items={d.pollutantsList || []} onChange={v=>upd('pollutantsList', v)} />}
                    </div>
                )}
            </div>
        );

        const ModuleB5 = ({ d_b5, d_b1, upd_b5 }) => {
            const updateSiteBio = (id, field, value) => upd_b5('sitesBiodiversity', { ...d_b5.sitesBiodiversity, [id]: { ...(d_b5.sitesBiodiversity[id] || { areaHectares: 0, sensitiveAreaType: 'Nessuna', specifications: '' }), [field]: value } });
            const totalLandUseCalc = Number(d_b5.landUse.sealedArea) + Number(d_b5.landUse.natureAreaInside) + Number(d_b5.landUse.natureAreaOutside);

            return (
                <div className="space-y-8 animate-fadeIn">
                    <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-sm">
                        <div className="flex justify-between items-center mb-4 border-b pb-3"><h3 className="font-bold text-sm text-slate-800 flex items-center gap-2"><Globe size={18} className="text-emerald-600"/> Mappatura Aree Sensibili</h3><div className="flex gap-3"><a href="https://natura2000.eea.europa.eu/" target="_blank" rel="noreferrer" className="text-xs font-semibold text-blue-600 hover:underline">Natura 2000</a></div></div>
                        <div className="border rounded-lg overflow-x-auto bg-white">
                            <table className="w-full text-sm text-left"><thead className="bg-slate-100 text-xs border-b"><tr><th className="p-3">Sito (dal B1)</th><th className="p-3">Area (ha)</th><th className="p-3">Area Sensibile</th><th className="p-3">Specifiche</th></tr></thead>
                                <tbody>
                                    {d_b1.sites && d_b1.sites[0].name ? d_b1.sites.map(s => {
                                        const bioData = d_b5.sitesBiodiversity[s.id] || { areaHectares: 0, sensitiveAreaType: 'Nessuna', specifications: '' };
                                        const isSen = bioData.sensitiveAreaType !== 'Nessuna';
                                        return (
                                            <tr key={s.id} className={`border-b ${isSen ? 'bg-orange-50/30' : ''}`}>
                                                <td className="p-3 font-semibold text-slate-700">{s.name || 'Senza nome'}</td>
                                                <td className="p-2"><input type="number" step="any" className="w-full p-1.5 border rounded text-xs" value={bioData.areaHectares||''} onChange={e=>updateSiteBio(s.id, 'areaHectares', Number(e.target.value))} /></td>
                                                <td className="p-2"><select className="w-full p-1.5 border rounded text-xs" value={bioData.sensitiveAreaType} onChange={e=>updateSiteBio(s.id, 'sensitiveAreaType', e.target.value)}>{SENSITIVE_AREA_TYPES.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select></td>
                                                <td className="p-2"><input type="text" className={`w-full p-1.5 border rounded text-xs ${!isSen?'bg-slate-100':''}`} value={bioData.specifications} onChange={e=>updateSiteBio(s.id, 'specifications', e.target.value)} disabled={!isSen}/></td>
                                            </tr>
                                        );
                                    }) : <tr><td colSpan="4" className="p-4 text-center text-xs italic text-slate-500">Nessun sito nel B1.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-sm">
                        <h3 className="font-bold text-sm text-slate-800 mb-4 border-b pb-3 flex items-center gap-2"><MapPin size={18} className="text-emerald-600"/> Uso del Suolo (Par. 74-76)</h3>
                        <div className="grid grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <Input label="Area Sigillata (m²)" type="number" unit="m²" value={d_b5.landUse.sealedArea} onChange={v=>upd_b5('landUse', {...d_b5.landUse, sealedArea: v})} />
                                <Input label="Area Naturalistica Interna (m²)" type="number" unit="m²" value={d_b5.landUse.natureAreaInside} onChange={v=>upd_b5('landUse', {...d_b5.landUse, natureAreaInside: v})} />
                                <Input label="Area Naturalistica Esterna (m²)" type="number" unit="m²" value={d_b5.landUse.natureAreaOutside} onChange={v=>upd_b5('landUse', {...d_b5.landUse, natureAreaOutside: v})} />
                            </div>
                            <div className="bg-white p-6 border rounded-lg flex flex-col justify-center items-center text-center">
                                <Calculator size={32} className="text-emerald-600 mb-3" />
                                <p className="text-xs uppercase font-bold text-slate-500 mb-1">Utilizzo Totale</p>
                                <p className="text-4xl font-black">{fmtInt(totalLandUseCalc)} <span className="text-lg">m²</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ModuleB6 = ({ d_b6, d_b1, upd_b6, calc }) => {
            const [showWiz, setShowWiz] = useState(false);
            const updateSiteWater = (id, field, value) => upd_b6('sitesWater', { ...d_b6.sitesWater, [id]: { ...(d_b6.sitesWater[id] || { withdrawal: 0, discharge: 0, stressLevel: 'Basso (<10%)' }), [field]: value } });
            
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="flex justify-between bg-slate-50 p-4 rounded-lg border">
                        <h3 className="font-bold text-sm flex items-center gap-2"><Droplets size={18} className="text-blue-500"/> Prelievi e Scarichi Idrici</h3>
                        <button onClick={() => setShowWiz(!showWiz)} className="text-xs font-semibold flex items-center gap-1 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded border border-indigo-200"><Calculator size={14}/> Wizard Coworking</button>
                    </div>
                    {showWiz && <CoworkingWizard sites={d_b1.sites} onApply={(id, v) => { updateSiteWater(id, 'withdrawal', v); setShowWiz(false); }} />}
                    
                    <div className="border rounded-lg overflow-x-auto bg-white shadow-sm">
                        <table className="w-full text-sm text-left"><thead className="bg-slate-100 text-xs border-b"><tr><th className="p-3">Sito (B1)</th><th className="p-3">Prelievo (m³)</th><th className="p-3">Scarico (m³)</th><th className="p-3 bg-slate-200/50">Consumo (m³)</th><th className="p-3 text-center">Livello Stress Idrico (WRI/EEA) <InfoButton topic="b6" /></th></tr></thead>
                            <tbody>
                                {d_b1.sites && d_b1.sites[0].name ? d_b1.sites.map(s => {
                                    const w = d_b6.sitesWater[s.id] || { withdrawal: 0, discharge: 0, stressLevel: 'Basso (<10%)' };
                                    const cons = Math.max(0, (w.withdrawal||0) - (w.discharge||0));
                                    
                                    // Determina se il livello di stress selezioato supera il 40% (EFRAG Threshold)
                                    const isHighStress = w.stressLevel === 'Alto (40-80%)' || w.stressLevel === 'Estremo (>80%)';

                                    return (
                                        <tr key={s.id} className={`border-b ${isHighStress ? 'bg-red-50/20' : ''}`}>
                                            <td className="p-3 font-semibold">{s.name || 'Senza nome'}</td>
                                            <td className="p-2"><input type="number" step="any" className="w-full p-1.5 border rounded text-xs" value={w.withdrawal||''} onChange={e=>updateSiteWater(s.id, 'withdrawal', Number(e.target.value))} /></td>
                                            <td className="p-2"><input type="number" step="any" className="w-full p-1.5 border rounded text-xs" value={w.discharge||''} onChange={e=>updateSiteWater(s.id, 'discharge', Number(e.target.value))} /></td>
                                            <td className="p-3 font-mono font-bold text-blue-700 bg-slate-50/50">{fmt(cons)}</td>
                                            
                                            {/* Sostituzione Checkbox con Dropdown Intelligente */}
                                            <td className="p-2">
                                                <select 
                                                    className={`w-full p-1.5 border rounded text-xs font-semibold ${isHighStress ? 'bg-red-50 text-red-700 border-red-300' : 'bg-slate-50 border-slate-300 text-slate-700'}`} 
                                                    value={w.stressLevel || 'Basso (<10%)'} 
                                                    onChange={e=>updateSiteWater(s.id, 'stressLevel', e.target.value)}
                                                >
                                                    {STRESS_LEVELS.map(level => <option key={level} value={level}>{level}</option>)}
                                                </select>
                                            </td>
                                        </tr>
                                    );
                                }) : <tr><td colSpan="5" className="p-4 text-center text-xs italic">Nessun sito operativo.</td></tr>}
                            </tbody>
                            <tfoot className="bg-slate-800 text-white font-bold text-xs"><tr><td className="p-3">Totale</td><td className="p-3">{fmt(calc.waterTotalWithdrawal)} m³</td><td className="p-3">{fmt(calc.waterTotalDischarge)} m³</td><td className="p-3 text-emerald-400">{fmt(calc.waterTotalConsumption)} m³</td><td></td></tr></tfoot>
                        </table>
                    </div>

                    {/* Banner Poka-Yoke Helper Contestuale */}
                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 flex flex-col gap-3 shadow-sm mt-2">
                        <div className="flex items-start gap-2 text-blue-900">
                            <Info size={16} className="shrink-0 mt-0.5 text-blue-600" />
                            <p className="text-xs font-medium leading-relaxed">
                                <strong className="text-blue-700">Regola EFRAG (Par. 91-93):</strong> Seleziona nella tendina l'indicatore <strong className="font-bold underline">Water Stress</strong> (e non 'Overall Risk'). Il sistema calcolerà un'area a forte stress solo se il valore selezionato è <strong>Alto</strong> (40-80%) o <strong>Estremo</strong> (&gt;80%). Verifica l'ubicazione tramite:
                            </p>
                        </div>
                        <div className="flex flex-wrap gap-3 ml-6">
                            <a href="https://www.wri.org/applications/aqueduct/water-risk-atlas" target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 text-xs font-bold bg-white text-blue-700 border border-blue-300 px-3 py-1.5 rounded hover:bg-blue-100 hover:border-blue-400 transition-colors shadow-sm">
                                <ExternalLink size={14} /> WRI Aqueduct
                            </a>
                            <a href="https://www.eea.europa.eu/data-and-maps/explore-interactive-maps/water-exploitation-index-for-river-1" target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 text-xs font-bold bg-white text-blue-700 border border-blue-300 px-3 py-1.5 rounded hover:bg-blue-100 hover:border-blue-400 transition-colors shadow-sm">
                                <ExternalLink size={14} /> EEA WEI+
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        const ModuleB7 = ({ d_b7, calc, upd_b7 }) => {
            const [tab, setTab] = useState('circ');
            return (
                <div className="space-y-4 animate-fadeIn">
                    <div className="flex border-b overflow-x-auto custom-scrollbar">
                        <button onClick={()=>setTab('circ')} className={`px-4 py-3 text-sm font-bold flex gap-2 ${tab==='circ' ? 'border-b-2 border-emerald-600 text-emerald-700' : 'text-slate-500'}`}><RefreshCw size={16}/> Strategia Circolare</button>
                        <button onClick={()=>setTab('waste')} className={`px-4 py-3 text-sm font-bold flex gap-2 ${tab==='waste' ? 'border-b-2 border-emerald-600 text-emerald-700' : 'text-slate-500'}`}><Trash2 size={16}/> Gestione Rifiuti</button>
                        <button onClick={()=>setTab('mass')} className={`px-4 py-3 text-sm font-bold flex gap-2 ${tab==='mass' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-slate-500'}`}><Layers size={16}/> Flussi di Massa</button>
                    </div>
                    <div className="p-5 bg-white border rounded-b-lg rounded-tr-lg shadow-sm min-h-[300px]">
                        {tab === 'circ' && (
                            <div className="space-y-4 animate-fadeIn">
                                <Textarea label="1. Eliminare sprechi e inquinamento (Design)" value={d_b7.circularStrategy.elimination} onChange={v=>upd_b7('circularStrategy', {...d_b7.circularStrategy, elimination: v})} />
                                <Textarea label="2. Far circolare materiali (Riuso/Riciclo)" value={d_b7.circularStrategy.circulation} onChange={v=>upd_b7('circularStrategy', {...d_b7.circularStrategy, circulation: v})} />
                                <Textarea label="3. Rigenerare la natura (Biomateriali)" value={d_b7.circularStrategy.regeneration} onChange={v=>upd_b7('circularStrategy', {...d_b7.circularStrategy, regeneration: v})} />
                            </div>
                        )}
                        {tab === 'waste' && (
                            <div className="space-y-6 animate-fadeIn">
                                <label className="flex items-center gap-3 p-4 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100">
                                    <input type="checkbox" checked={d_b7.onlyDomesticWaste} onChange={e=>upd_b7('onlyDomesticWaste', e.target.checked)} className="w-5 h-5 text-emerald-600 rounded" />
                                    <div><div className="font-bold text-sm text-slate-800">Esenzione per Rifiuti Domestici (Par. 95)</div><div className="text-xs text-slate-500">Spunta se l'azienda produce solo rifiuti assimilabili agli urbani.</div></div>
                                </label>
                                {!d_b7.onlyDomesticWaste && (
                                    <>
                                        <div className="grid grid-cols-4 gap-4 mb-4">
                                            <div className="bg-slate-50 p-3 rounded border text-center"><p className="text-[10px] uppercase font-bold text-slate-500">Totali</p><p className="text-xl font-black">{fmt(calc.b7_totalWaste)} t</p></div>
                                            <div className="bg-emerald-50 p-3 rounded border border-emerald-200 text-center"><p className="text-[10px] uppercase font-bold text-emerald-600">Riciclati</p><p className="text-xl font-black text-emerald-700">{fmt(calc.b7_totalRecycled)} t</p></div>
                                            <div className="bg-slate-100 p-3 rounded border text-center"><p className="text-[10px] uppercase font-bold text-slate-500">Smaltiti</p><p className="text-xl font-black">{fmt(calc.b7_totalDisposed)} t</p></div>
                                            <div className="bg-blue-50 p-3 rounded border border-blue-200 text-center"><p className="text-[10px] uppercase font-bold text-blue-700">Circolarità</p><p className="text-xl font-black text-blue-800">{fmt(calc.b7_circularityRate)}%</p></div>
                                        </div>
                                        <WasteManager items={d_b7.wasteList} onChange={v=>upd_b7('wasteList', v)} />
                                    </>
                                )}
                            </div>
                        )}
                        {tab === 'mass' && <MassFlowManager items={d_b7.massFlows} onChange={v=>upd_b7('massFlows', v)} />}
                    </div>
                </div>
            );
        };

        const ModuleB8 = ({ d_b8, d_b1, upd_b8, calc }) => {
            const uniqueCountries = useMemo(() => [...new Set(d_b1.sites.map(s => s.country?.trim()).filter(c => c))], [d_b1.sites]);
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <div className="flex justify-between items-center mb-4 border-b pb-3"><h3 className="font-bold text-sm flex items-center gap-2"><Users size={18} className="text-blue-600"/> Contratti e Orari (Par. 39a)</h3><Select label="Metodologia" value={d_b8.countMethod} options={["Fine del periodo", "Media del periodo"]} onChange={v=>upd_b8('countMethod', v)} /></div>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div className="bg-white p-4 border rounded-lg shadow-sm"><h4 className="text-xs font-bold text-slate-500 uppercase mb-3 border-b">Tempo Indeterminato</h4><Input label="Full-Time" type="number" value={d_b8.permanent_ft} onChange={v=>upd_b8('permanent_ft', v)} /><Input label="Part-Time" type="number" value={d_b8.permanent_pt} onChange={v=>upd_b8('permanent_pt', v)} /></div>
                            <div className="bg-white p-4 border rounded-lg shadow-sm"><h4 className="text-xs font-bold text-slate-500 uppercase mb-3 border-b">Tempo Determinato</h4><Input label="Full-Time" type="number" value={d_b8.temporary_ft} onChange={v=>upd_b8('temporary_ft', v)} /><Input label="Part-Time" type="number" value={d_b8.temporary_pt} onChange={v=>upd_b8('temporary_pt', v)} /></div>
                        </div>
                        <div className="bg-blue-600 text-white p-4 rounded-lg flex justify-between items-center shadow-inner mt-2">
                            <div><span className="text-xs uppercase font-bold tracking-wider block">Headcount Totale</span></div><span className="text-3xl font-black">{fmtInt(calc.b8_total_headcount)}</span>
                        </div>
                    </div>
                    <div className={`p-5 rounded-lg border shadow-sm ${calc.b8_gender_diff === 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                        <div className="flex justify-between mb-4 border-b pb-3"><h3 className="font-bold text-sm">Disaggregazione per Genere</h3></div>
                        <div className="grid grid-cols-4 gap-4"><Input label="Uomini" type="number" value={d_b8.male} onChange={v=>upd_b8('male', v)} /><Input label="Donne" type="number" value={d_b8.female} onChange={v=>upd_b8('female', v)} /><Input label="Altro" type="number" value={d_b8.other} onChange={v=>upd_b8('other', v)} /><Input label="N.D." type="number" value={d_b8.notReported} onChange={v=>upd_b8('notReported', v)} /></div>
                    </div>
                    <div className={`p-5 rounded-lg border shadow-sm ${calc.b8_country_diff === 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-orange-50 border-orange-200'}`}>
                        <div className="flex justify-between mb-4 border-b pb-3"><h3 className="font-bold text-sm">Disaggregazione per Paese</h3></div>
                        <div className="grid grid-cols-3 gap-4">
                            {uniqueCountries.length ? uniqueCountries.map(c => <Input key={c} label={`Dipendenti in ${c}`} type="number" value={d_b8.countryHeadcounts[c] || 0} onChange={v=>upd_b8('countryHeadcounts', { ...d_b8.countryHeadcounts, [c]: v })} />) : <p className="text-sm italic">Nessun Paese nel Mod. B1.</p>}
                        </div>
                    </div>
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <h3 className="font-bold text-sm mb-4 border-b pb-3 flex items-center gap-2"><Calculator size={18} className="text-blue-600"/> FTE e Turnover (Par. 40, 110)</h3>
                        <div className="grid grid-cols-2 gap-6">
                            <div><Input label="FTE Totale" type="number" value={d_b8.manual_fte} onChange={v=>upd_b8('manual_fte', v)} /></div>
                            <div className="p-4 rounded-lg border bg-white">
                                <Input label="Dipendenti usciti (Leavers)" type="number" value={d_b8.turnoverLeavers} onChange={v=>upd_b8('turnoverLeavers', v)} />
                                {d_b8.countMethod === "Fine del periodo" ? <Input label="Headcount iniziale" type="number" value={d_b8.headcountStart} onChange={v=>upd_b8('headcountStart', v)} /> : <Input label="Media annua" type="number" value={d_b8.manualAverageHeadcount} onChange={v=>upd_b8('manualAverageHeadcount', v)} />}
                                <div className="mt-3 font-bold text-blue-700">Turnover: {calc.isTurnoverCalculable ? `${fmt(calc.calculatedTurnoverRate, 1)}%` : 'N/D'}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ModuleB9 = ({ d, upd, calc }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><Activity size={18} className="text-blue-600"/> Infortuni sul Lavoro</h3>
                    <div className="grid grid-cols-2 gap-6 mb-4"><Input label="Numero Infortuni Registrabili" type="number" value={d.injuries} onChange={v=>upd('injuries', v)} /><Input label="Ore Lavorate Totali" type="number" value={d.hoursWorked} onChange={v=>upd('hoursWorked', v)} /></div>
                    <div className="bg-white border p-3 rounded-lg flex justify-between items-center mt-2"><div><span className="text-sm font-bold text-slate-600">TRIR (Tasso Infortuni)</span></div><span className="text-2xl font-black text-blue-700">{fmt(calc.b9_injury_rate, 2)}</span></div>
                </div>
                <div className="bg-red-50 p-5 rounded-lg border border-red-200 shadow-sm">
                    <h3 className="font-bold text-sm text-red-800 mb-4 border-b border-red-200 pb-3 flex gap-2"><AlertTriangle size={18}/> Decessi sul Lavoro</h3>
                    <div className="grid grid-cols-2 gap-6"><Input label="Da infortuni" type="number" value={d.fatalitiesInjuries} onChange={v=>upd('fatalitiesInjuries', v)} /><Input label="Da malattie" type="number" value={d.fatalitiesIllHealth} onChange={v=>upd('fatalitiesIllHealth', v)} /></div>
                </div>
            </div>
        );

        const ModuleB10 = ({ d, upd, calc }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><Coins size={18} className="text-blue-600"/> Retribuzione e Pay Gap</h3>
                    <Select label="Retribuzione pari/superiore al salario minimo?" value={d.minimumWage} options={['Sì', 'No', 'N/A']} onChange={v=>upd('minimumWage', v)} />
                    
                    {/* Modifica UX (Soluzione 3): Nascondere gli input se l'azienda è esente */}
                    <div className={`p-4 rounded-lg border mt-6 ${calc.b10_isPayGapExempt ? 'bg-emerald-50 border-emerald-200' : 'bg-white'}`}>
                        {calc.b10_isPayGapExempt ? (
                            <div className="text-emerald-800 font-semibold flex items-center gap-2">
                                <CheckCircle2 size={18} /> Esente dal calcolo del Gender Pay Gap (Meno di 150 dipendenti)
                            </div>
                        ) : (
                            <>
                                <div className="grid grid-cols-2 gap-4">
                                    <Input label="Paga Oraria Uomini" type="number" unit="€" value={d.hourly_rate_male} onChange={v=>upd('hourly_rate_male', v)} />
                                    <Input label="Paga Oraria Donne" type="number" unit="€" value={d.hourly_rate_female} onChange={v=>upd('hourly_rate_female', v)} />
                                </div>
                                <div className="mt-2 font-bold text-blue-700">Gender Pay Gap: {fmt(calc.pay_gap_pct, 1)}%</div>
                            </>
                        )}
                    </div>
                </div>
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><Briefcase size={18} className="text-blue-600"/> Formazione e Contrattazione</h3>
                    <div className="grid grid-cols-2 gap-6"><Input label="Dipendenti coperti da CCNL" type="number" value={d.employeesCoveredByCBA} onChange={v=>upd('employeesCoveredByCBA', v)} /></div>
                    <div className="mt-6 border-t pt-4 grid grid-cols-2 gap-6"><Input label="Ore Formazione Totali (Uomini)" type="number" value={d.trainingHoursMale} onChange={v=>upd('trainingHoursMale', v)} /><Input label="Ore Formazione Totali (Donne)" type="number" value={d.trainingHoursFemale} onChange={v=>upd('trainingHoursFemale', v)} /></div>
                </div>
            </div>
        );

        const ModuleB11 = ({ d, upd }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><ShieldAlert size={18} className="text-blue-600"/> Condotta Aziendale (Corruzione)</h3>
                    <Select label="Si sono verificati incidenti legali per corruzione o concussione?" value={d.hasIncidents} options={['Sì', 'No']} onChange={v => { upd('hasIncidents', v); if (v === 'No') { upd('corruptionConvictions', 0); upd('corruptionFines', 0); } }} />
                    {d.hasIncidents === 'No' && <div className="p-4 bg-emerald-50 text-emerald-800 border-emerald-200 rounded-lg flex items-start gap-3 mt-4"><CheckCircle2 size={20}/><p className="font-bold text-sm">Zero-Defect Declaration Registrata</p></div>}
                    {d.hasIncidents === 'Sì' && <div className="p-5 bg-red-50 border-red-200 rounded-lg mt-4 shadow-inner grid grid-cols-2 gap-6"><Input label="Numero di Condanne Penali" type="number" value={d.corruptionConvictions} onChange={v=>upd('corruptionConvictions', v)} /><Input label="Ammontare Multe" type="number" unit="€" value={d.corruptionFines} onChange={v=>upd('corruptionFines', v)} /></div>}
                </div>
            </div>
        );

        const ModuleC1 = ({ d, upd }) => {
            const [tab, setTab] = useState('A');
            return (
                <div className="space-y-4 animate-fadeIn">
                    <div className="flex border-b overflow-x-auto"><button onClick={()=>setTab('A')} className={`px-4 py-3 text-sm font-bold ${tab==='A' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-slate-500'}`}>Prodotti & Servizi</button><button onClick={()=>setTab('B')} className={`px-4 py-3 text-sm font-bold ${tab==='B' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-slate-500'}`}>Mercati</button><button onClick={()=>setTab('C')} className={`px-4 py-3 text-sm font-bold ${tab==='C' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-slate-500'}`}>Catena Valore</button><button onClick={()=>setTab('D')} className={`px-4 py-3 text-sm font-bold ${tab==='D' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-slate-500'}`}>Strategia ESG</button></div>
                    <div className="p-5 bg-slate-50 border rounded-b-lg min-h-[220px]">
                        {tab === 'A' && <Textarea label="Principali prodotti/servizi" value={d.productsAndServices} onChange={v=>upd('productsAndServices', v)} />}
                        {tab === 'B' && <Textarea label="Principali mercati" value={d.markets} onChange={v=>upd('markets', v)} />}
                        {tab === 'C' && <Textarea label="Relazioni commerciali" value={d.valueChain} onChange={v=>upd('valueChain', v)} />}
                        {tab === 'D' && <Textarea label="Iniziative ESG" value={d.esgStrategy} onChange={v=>upd('esgStrategy', v)} />}
                    </div>
                </div>
            );
        };

        const ModuleC3 = ({ d_c3, upd_c3, calc }) => {
            const handleAutoFillB3 = () => upd_c3('targets', [
                { id: Date.now(), scope: "Scope 1", baseYear: calc.referenceYear, baseValue: calc.scope1 || 0, reductionPct: 42, targetYear: 2030, coveragePct: 100 },
                { id: Date.now()+1, scope: "Scope 2 (Market)", baseYear: calc.referenceYear, baseValue: calc.scope2_mkt || 0, reductionPct: 42, targetYear: 2030, coveragePct: 100 }
            ].concat(calc.scope3_tot > 0 ? [{ id: Date.now()+2, scope: "Scope 3", baseYear: calc.referenceYear, baseValue: calc.scope3_tot, reductionPct: 42, targetYear: 2030, coveragePct: 100 }] : []));
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm"><C3TargetManager targets={d_c3.targets} onChange={v=>upd_c3('targets', v)} onAutoFillB3={handleAutoFillB3} /><C3ActionManager items={d_c3.actions} onChange={v=>upd_c3('actions', v)} /></div>
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><Briefcase size={18} className="text-blue-600"/> Piano di Transizione Climatico (Par. 55-56)</h3>
                        <div className="grid grid-cols-2 gap-6 mb-4"><Select label="Settore ad alto impatto?" value={d_c3.isHighImpactSector} options={['Sì', 'No']} onChange={v=>upd_c3('isHighImpactSector', v)} />{d_c3.isHighImpactSector === 'Sì' && <Select label="Stato del Piano" value={d_c3.transitionPlanStatus} options={['Adottato', 'In fase di sviluppo', 'Non pianificato']} onChange={v=>upd_c3('transitionPlanStatus', v)} />}</div>
                        {(d_c3.transitionPlanStatus === 'Adottato' || d_c3.transitionPlanStatus === 'In fase di sviluppo') && <Textarea label="Sintesi del Piano" value={d_c3.transitionPlanDetails} onChange={v=>upd_c3('transitionPlanDetails', v)} />}
                    </div>
                </div>
            );
        };

        const ModuleC4 = ({ d_c4, upd_c4 }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm"><Textarea label="Metodologia di Valutazione Rischi (Par. 57b)" value={d_c4.assessmentMethodology} onChange={v=>upd_c4('assessmentMethodology', v)} /></div>
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm"><RiskManager title="Rischi Fisici (Par. 164)" type="physical" items={d_c4.physicalRisksList} onChange={v=>upd_c4('physicalRisksList', v)} icon={Flame} color="red" /><RiskManager title="Rischi di Transizione (Par. 165)" type="transition" items={d_c4.transitionRisksList} onChange={v=>upd_c4('transitionRisksList', v)} icon={Settings} color="orange" /></div>
            </div>
        );

        const ModuleC5 = ({ d_c5, upd_c5, calc }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><TargetIcon size={18} className="text-blue-600"/> Diversità a Livello Dirigenziale (Par. 59)</h3>
                    <div className="grid grid-cols-2 gap-6"><Input label="Donne Dirigenti" type="number" value={d_c5.managementWomen} onChange={v=>upd_c5('managementWomen', v)} /><Input label="Uomini Dirigenti" type="number" value={d_c5.managementMen} onChange={v=>upd_c5('managementMen', v)} /></div>
                    <div className="font-bold text-blue-700 mt-2">Rapporto Dirigenziale: {calc.c5_managementRatio}</div>
                </div>
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex gap-2"><Users size={18} className="text-blue-600"/> Forza Lavoro Esterna (Par. 60)</h3>
                    <div className="grid grid-cols-2 gap-6"><Input label="Autonomi esclusivi" type="number" value={d_c5.selfEmployed} onChange={v=>upd_c5('selfEmployed', v)} /><Input label="Interinali (Agenzie)" type="number" value={d_c5.temporaryAgencyWorkers} onChange={v=>upd_c5('temporaryAgencyWorkers', v)} /></div>
                </div>
            </div>
        );

        const ModuleC6 = ({ d_c6, upd_c6 }) => {
            const toggleTopic = (key) => upd_c6('policyTopics', { ...d_c6.policyTopics, [key]: !d_c6.policyTopics[key] });
            const labels = { childLabor: 'Lavoro minorile', forcedLabor: 'Lavoro forzato', trafficking: 'Tratta di esseri umani', discrimination: 'Discriminazione', incidentPrevention: 'Prevenzione degli incidenti' };
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <Select label="L'azienda dispone di policy sui diritti umani?" value={d_c6.humanRightsPolicy} options={['Sì', 'No']} onChange={v => { upd_c6('humanRightsPolicy', v); if(v==='No') { upd_c6('policyTopics', { childLabor: false, forcedLabor: false, trafficking: false, discrimination: false, incidentPrevention: false, other: false }); upd_c6('policyOtherDetails', ""); } }} />
                        {d_c6.humanRightsPolicy === 'Sì' && (
                            <div className="p-5 bg-white border rounded-lg mt-4"><label className="text-sm font-bold block mb-4 border-b pb-2">Ambiti coperti:</label><div className="grid grid-cols-2 gap-4">
                                {Object.keys(d_c6.policyTopics).filter(k=>k!=='other').map(k => <label key={k} className="flex gap-3 items-center"><input type="checkbox" checked={d_c6.policyTopics[k]} onChange={()=>toggleTopic(k)} className="w-4 h-4"/> <span className="text-sm">{labels[k] || k}</span></label>)}
                                <label className="flex gap-3 items-center"><input type="checkbox" checked={d_c6.policyTopics.other} onChange={()=>toggleTopic('other')} className="w-4 h-4"/> <span className="text-sm">Altro (specificare)</span></label>
                            </div></div>
                        )}
                        {d_c6.humanRightsPolicy === 'Sì' && d_c6.policyTopics.other && (
                            <div className="mt-4 animate-fadeIn"><Input label="Specifica altri ambiti" value={d_c6.policyOtherDetails} onChange={v=>upd_c6('policyOtherDetails', v)} /></div>
                        )}
                    </div>
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm"><Select label="Meccanismo di Reclamo (Whistleblowing)?" value={d_c6.grievanceMechanism} options={['Sì', 'No']} onChange={v=>upd_c6('grievanceMechanism', v)} /></div>
                </div>
            );
        };

        const ModuleC7 = ({ d_c7, upd_c7 }) => {
            const toggleTopic = (key) => upd_c7('incidentTypes', { ...d_c7.incidentTypes, [key]: !d_c7.incidentTypes[key] });
            const labels = { childLabor: 'Lavoro minorile', forcedLabor: 'Lavoro forzato', trafficking: 'Tratta di esseri umani', discrimination: 'Discriminazione' };
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <Select label="Incidenti confermati tra i dipendenti?" value={d_c7.incidents} options={['Sì', 'No']} onChange={v=>{ upd_c7('incidents', v); if(v==='No') upd_c7('remediationActions', ''); }} />
                        {d_c7.incidents === 'Sì' && (
                            <div className="p-5 bg-red-50 border-red-200 rounded-lg mt-4">
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    {Object.keys(d_c7.incidentTypes).filter(k=>k!=='other').map(k => <label key={k} className="flex gap-3"><input type="checkbox" checked={d_c7.incidentTypes[k]} onChange={()=>toggleTopic(k)} className="w-4 h-4 text-red-600"/> <span className="text-sm font-bold text-red-900">{labels[k] || k}</span></label>)}
                                    <label className="flex gap-3"><input type="checkbox" checked={d_c7.incidentTypes.other} onChange={()=>toggleTopic('other')} className="w-4 h-4 text-red-600"/> <span className="text-sm font-bold text-red-900">Altro (specificare)</span></label>
                                </div>
                                {d_c7.incidentTypes.other && <div className="mb-4"><Input label="Specifica altri incidenti" value={d_c7.incidentOtherDetails} onChange={v=>upd_c7('incidentOtherDetails', v)} /></div>}
                                <Textarea label="Azioni di rimedio" value={d_c7.remediationActions} onChange={v=>upd_c7('remediationActions', v)} />
                            </div>
                        )}
                    </div>
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <Select label="Incidenti nella Catena del Valore?" value={d_c7.valueChainIncidents} options={['Sì', 'No']} onChange={v=>{ upd_c7('valueChainIncidents', v); if(v==='No') upd_c7('valueChainDetails', ''); }} />
                        {d_c7.valueChainIncidents === 'Sì' && <div className="mt-4"><Textarea label="Dettagli incidenti" value={d_c7.valueChainDetails} onChange={v=>upd_c7('valueChainDetails', v)} /></div>}
                    </div>
                </div>
            );
        };

        const ModuleC8 = ({ d_c8, upd_c8, calc }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                    <h3 className="font-bold text-sm mb-4 border-b pb-3 flex items-center gap-2"><Flame size={18} className="text-orange-600"/> Ricavi Sensibili (Benchmark UE)</h3>
                    {calc.globalRev === 0 && <div className="p-3 bg-orange-50 text-orange-800 border border-orange-200 rounded text-xs mb-6 flex gap-2"><AlertTriangle size={16}/><span>Fatturato B1 pari a zero. Aggiornalo per le % corrette.</span></div>}
                    <div className="space-y-4">
                        {[{label:'Armi', key:'revenueWeapons', pct: calc.pctWeapons, thr: '>0%'}, {label:'Tabacco', key:'revenueTobacco', pct: calc.pctTobacco, thr: '>0%'}, {label:'Carbone', key:'revenueCoal', pct: calc.pctCoal, thr: '≥1%'}, {label:'Petrolio/Gas', key:'revenueOil', key2:'revenueGas', pct: calc.pctOilGas, thr: '≥10%'}].map(item => (
                            <div key={item.label} className="flex justify-between p-3 bg-white border rounded">
                                <div className="w-1/3"><label className="text-xs font-bold block">{item.label}</label><span className="text-[10px] text-slate-400">Soglia: {item.thr}</span></div>
                                <div className="w-1/3 px-4 flex gap-2">
                                    <input type="number" value={d_c8[item.key]||''} onChange={e=>upd_c8(item.key, Number(e.target.value))} className="w-full p-1.5 border rounded text-xs bg-slate-50 text-right" placeholder="€" />
                                    {item.key2 && <input type="number" value={d_c8[item.key2]||''} onChange={e=>upd_c8(item.key2, Number(e.target.value))} className="w-full p-1.5 border rounded text-xs bg-slate-50 text-right" placeholder="€" />}
                                </div>
                                <div className="w-1/3 text-right font-mono font-bold text-slate-600">{fmt(item.pct, 1)}%</div>
                            </div>
                        ))}
                    </div>
                    <div className={`mt-6 p-4 rounded-lg flex items-center gap-4 border ${calc.isExcludedFromBenchmarks ? 'bg-red-50 border-red-200 text-red-800' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
                        {calc.isExcludedFromBenchmarks ? <AlertTriangle size={32} /> : <CheckCircle2 size={32} />}
                        <div><h4 className="font-bold">{calc.isExcludedFromBenchmarks ? 'Escluso dai Benchmark UE' : 'Allineato ai Benchmark UE'}</h4></div>
                    </div>
                </div>
            </div>
        );

        const ModuleC9 = ({ d_c9, upd_c9, calc }) => {
            const femPct = calc.boardTotal > 0 ? (d_c9.boardMembersFemale / calc.boardTotal) * 100 : 0;
            const malePct = calc.boardTotal > 0 ? (d_c9.boardMembersMale / calc.boardTotal) * 100 : 0;
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="bg-slate-50 p-5 rounded-lg border shadow-sm">
                        <div className="grid grid-cols-2 gap-6 mb-6"><Input label="Uomini nel CdA" type="number" value={d_c9.boardMembersMale} onChange={v=>upd_c9('boardMembersMale', v)} /><Input label="Donne nel CdA" type="number" value={d_c9.boardMembersFemale} onChange={v=>upd_c9('boardMembersFemale', v)} /></div>
                        <div className="bg-white border p-5 rounded-lg text-center">
                            <h4 className="text-xs font-bold uppercase mb-3">Gender Diversity Ratio</h4>
                            <div className="flex h-8 rounded-full overflow-hidden border">
                                {calc.boardTotal === 0 ? <div className="w-full bg-slate-200 text-xs flex items-center justify-center">N/D</div> : <><div className="bg-sky-500 text-white text-xs flex items-center justify-center" style={{width:`${malePct}%`}}>U</div><div className="bg-pink-500 text-white text-xs flex items-center justify-center" style={{width:`${femPct}%`}}>D</div></>}
                            </div>
                            <span className={`text-3xl font-black mt-4 block ${calc.board_diversity_ratio < 30 ? 'text-orange-500' : 'text-emerald-600'}`}>{fmt(calc.board_diversity_ratio, 1)}%</span>
                        </div>
                    </div>
                </div>
            );
        };

        /* =========================================================
           REGISTRY PATTERN (Global Scope per UI)
           ========================================================= */
        const MODULE_REGISTRY = {
            'b1': ({ data, upd }) => <ModuleB1 d={data.b1} meta={data.meta} upd={upd} />,
            'b2_c2': ({ fullData, upd }) => <ModuleB2_C2 d_b2={fullData.b2} d_c2={fullData.c2} upd_b2={(f,v)=>upd('b2', f, v)} upd_c2={(f,v)=>upd('c2', f, v)} />,
            'b3': ({ data, upd, updScope3, calc, errors }) => <ModuleB3 d={data.b3} updEnergy={(f,v)=>upd('b3', f, v)} updScope3={updScope3} updFactors={(factors)=>upd('settings', 'emissionFactors', { ...data.settings.emissionFactors, ...factors })} calc={calc} errors={errors} />,
            'b4': ({ data, upd }) => <ModuleB4 d={data.b4} upd={(f,v)=>upd('b4', f, v)} />,
            'b5': ({ data, fullData, upd }) => <ModuleB5 d_b5={data.b5} d_b1={fullData.b1} upd_b5={(f,v)=>upd('b5', f, v)} />,
            'b6': ({ data, fullData, upd, calc }) => <ModuleB6 d_b6={data.b6} d_b1={fullData.b1} upd_b6={(f,v)=>upd('b6', f, v)} calc={calc} />,
            'b7': ({ data, upd, calc }) => <ModuleB7 d_b7={data.b7} upd_b7={(f,v)=>upd('b7', f, v)} calc={calc} />,
            'b8': ({ data, fullData, upd, calc }) => <ModuleB8 d_b8={data.b8} d_b1={fullData.b1} upd_b8={(f,v)=>upd('b8', f, v)} calc={calc} />,
            'b9': ({ data, upd, calc }) => <ModuleB9 d={data.b9} upd={(f,v)=>upd('b9', f, v)} calc={calc} />,
            'b10': ({ data, fullData, upd, calc }) => <ModuleB10 d={data.b10} upd={(f,v)=>upd('b10', f, v)} calc={calc} fullData={fullData} />,
            'b11': ({ data, upd }) => <ModuleB11 d={data.b11} upd={(f,v)=>upd('b11', f, v)} />,
            'c1': ({ data, upd }) => <ModuleC1 d={data.c1} upd={(f,v)=>upd('c1', f, v)} />,
            'c3': ({ data, upd, calc }) => <ModuleC3 d_c3={data.c3} upd_c3={(f,v)=>upd('c3', f, v)} calc={calc} />,
            'c4': ({ data, upd }) => <ModuleC4 d_c4={data.c4} upd_c4={(f,v)=>upd('c4', f, v)} />,
            'c5': ({ data, upd, calc }) => <ModuleC5 d_c5={data.c5} upd_c5={(f,v)=>upd('c5', f, v)} calc={calc} />,
            'c6': ({ data, upd }) => <ModuleC6 d_c6={data.c6} upd_c6={(f,v)=>upd('c6', f, v)} />,
            'c7': ({ data, upd }) => <ModuleC7 d_c7={data.c7} upd_c7={(f,v)=>upd('c7', f, v)} />,
            'c8': ({ data, upd, calc }) => <ModuleC8 d_c8={data.c8} upd_c8={(f,v)=>upd('c8', f, v)} calc={calc} />,
            'c9': ({ data, upd, calc }) => <ModuleC9 d_c9={data.c9} upd_c9={(f,v)=>upd('c9', f, v)} calc={calc} />
        };

        const VsmeSectionWrapper = ({ sectionKey, data, upd, updScope3, fullData, calc, errors }) => {
            const title = sectionKey === 'b2_c2' ? 'B2 / C2' : sectionKey.toUpperCase();
            const ModuleComponent = MODULE_REGISTRY[sectionKey];

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 animate-fadeIn">
                    <div className="flex items-center gap-3 mb-6 border-b pb-3">
                        <span className="bg-blue-600 text-white font-bold py-1 px-2 rounded text-sm uppercase">{title}</span>
                        <h2 className="text-xl font-bold text-slate-800">{MODULE_TITLES[sectionKey] || `Modulo ${title}`}</h2>
                    </div>
                    {ModuleComponent ? (
                        <ModuleComponent data={data} upd={upd} updScope3={updScope3} fullData={fullData} calc={calc} errors={errors} />
                    ) : (
                        <div className="p-4 bg-slate-50 border rounded text-slate-500 italic"><Info size={16} className="inline mr-2" /> Modulo in sviluppo o non configurato.</div>
                    )}
                </div>
            );
        };

        /* =========================================================
           VISTE BANCA E PDF NATIVO (ENTERPRISE PRINT ENGINE)
           ========================================================= */
        const BankViews = ({ eba, calc }) => (
            <div className="space-y-6 animate-fadeIn">
                <div className="bg-blue-950 text-white p-6 rounded-xl border-l-4 border-blue-500"><h2 className="text-2xl font-bold mb-1 flex gap-2"><Landmark className="text-blue-400"/> Cruscotto EBA (Credit Risk)</h2></div>
                <div className="grid grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-xl border shadow-sm"><h3 className="font-bold text-lg mb-4">Scoring ESG</h3><div className="flex justify-between mb-3 p-3 bg-slate-50 border rounded"><span>Rischio Fisico</span><span className={`px-3 py-1 rounded text-xs font-bold ${eba.physicalRisk.color}`}>{eba.physicalRisk.score}</span></div><div className="flex justify-between p-3 bg-slate-50 border rounded"><span>Transizione</span><span className={`px-3 py-1 rounded text-xs font-bold ${eba.transitionRisk.color}`}>{eba.transitionRisk.score}</span></div></div>
                    <div className="bg-white p-6 rounded-xl border shadow-sm"><h3 className="font-bold text-lg mb-4">Key Risk Indicators</h3><div className="space-y-3"><div className="flex justify-between border-b pb-2"><span>Intensità GHG (t/M€)</span><span className="font-bold text-blue-700">{fmt(calc.ghgIntensity, 2)}</span></div><div className="flex justify-between border-b pb-2"><span>Tasso Circolarità</span><span className={`font-bold ${calc.b7_circularityRate<20?'text-orange-600':'text-emerald-600'}`}>{fmt(calc.b7_circularityRate)}%</span></div></div></div>
                </div>
                <div className="bg-white p-6 rounded-xl border shadow-sm"><h3 className="font-bold text-lg mb-4 flex gap-2"><Target size={20} className="text-blue-600"/> Gap Analysis</h3>{eba.gaps.length === 0 ? <div className="p-3 bg-blue-50 text-blue-800 rounded border flex gap-2"><CheckCircle2/> Nessun gap critico.</div> : <div className="space-y-2">{eba.gaps.map((g,i) => <div key={i} className={`p-3 rounded flex gap-3 text-sm font-medium ${g.type==='critical'?'bg-red-50 text-red-800 border-red-200':'bg-orange-50 text-orange-800 border-orange-200'}`}><ShieldAlert size={18}/> {g.text}</div>)}</div>}</div>
            </div>
        );

        // PDF Helpers
        const PdfEmptyState = () => <div className="p-4 bg-slate-50 border border-slate-200 text-sm italic text-slate-500 mt-2 rounded">Dati non inseriti o sezione non applicabile.</div>;
        
        const PdfSmartLink = ({ url }) => {
            if (!url) return <span className="italic text-slate-500 text-xs">Non fornito</span>;
            const validUrl = url.startsWith('http') ? url : `https://${url}`;
            const displayUrl = url.length > 40 ? url.substring(0, 40) + '...' : url;
            return (
                <a href={validUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 underline break-all font-mono text-xs bg-blue-50 px-2 py-1 rounded border border-blue-100">
                    <ExternalLink size={12} className="shrink-0" />{displayUrl}
                </a>
            );
        };

        const PdfCoverPage = ({ data, calc }) => (
            <div className="pdf-page-break flex flex-col justify-center items-center text-center bg-blue-950 text-white p-12 print:h-[270mm] rounded-xl border-4 border-blue-500">
                <div className="mb-auto mt-24 w-full">
                    <h1 className="text-5xl font-black uppercase tracking-widest mb-8 border-b-4 border-blue-500 pb-8 text-white">{data.meta.projectName}</h1>
                    <h2 className="text-4xl font-semibold text-blue-200">{data.meta.companyName || 'Ragione Sociale Non Inserita'}</h2>
                </div>
                <div className="mb-24 text-left bg-blue-900/50 p-8 rounded-xl border border-blue-700 w-full max-w-2xl shadow-lg">
                    <h3 className="text-xl font-bold mb-4 text-blue-300 border-b border-blue-600 pb-2">Dettagli Rendicontazione</h3>
                    <p className="mb-2 text-lg"><strong className="text-white">Standard:</strong> EFRAG VSME (Edizione {calc.referenceYear})</p>
                    <p className="mb-2 text-lg"><strong className="text-white">Opzione:</strong> {data.b1.option}</p>
                    <p className="mb-2 text-lg"><strong className="text-white">Perimetro:</strong> {data.b1.reportingBasis}</p>
                    <p className="text-lg"><strong className="text-white">Periodo:</strong> {data.meta.periodStart ? new Date(data.meta.periodStart).toLocaleDateString('it-IT') : 'N/D'} - {data.meta.periodEnd ? new Date(data.meta.periodEnd).toLocaleDateString('it-IT') : 'N/D'}</p>
                </div>
                <div className="mt-auto text-sm text-blue-400">
                    <p>Generato tramite VSME Suite Enterprise Engine</p>
                </div>
            </div>
        );

        const PdfTableOfContents = () => (
            <div className="pdf-page-break py-12 pdf-avoid-break">
                <h2 className="text-3xl font-black mb-8 border-b-4 border-blue-900 pb-4 text-blue-900">Indice dei Contenuti</h2>
                <div className="space-y-6 text-lg font-semibold text-slate-700">
                    <div className="flex justify-between border-b border-dotted border-slate-400 pb-2"><span className="flex items-center gap-2"><Landmark size={20} className="text-blue-600"/> 1. Executive Summary EBA (Risk & Gap Analysis)</span></div>
                    <div className="flex justify-between border-b border-dotted border-slate-400 pb-2"><span className="flex items-center gap-2"><Building size={20} className="text-blue-600"/> 2. Profilo Aziendale & Governance (Moduli B1, C8, C9, B11)</span></div>
                    <div className="flex justify-between border-b border-dotted border-slate-400 pb-2"><span className="flex items-center gap-2"><Leaf size={20} className="text-emerald-600"/> 3. Metriche Ambientali (Moduli B3, B4, B5, B6, B7, C3, C4)</span></div>
                    <div className="flex justify-between border-b border-dotted border-slate-400 pb-2"><span className="flex items-center gap-2"><Users size={20} className="text-orange-600"/> 4. Forza Lavoro e Aspetti Sociali (Moduli B8, B9, B10, C5, C6, C7)</span></div>
                    <div className="flex justify-between border-b border-dotted border-slate-400 pb-2"><span className="flex items-center gap-2"><FileText size={20} className="text-slate-600"/> 5. Modello di Business e Strategia (Modulo C1)</span></div>
                </div>
            </div>
        );

        const PdfSection_EBA = ({ eba }) => (
            <div className="pdf-page-break mb-10 pdf-avoid-break">
                <h3 className="font-bold text-2xl border-b-4 border-blue-900 text-blue-900 mb-6 pb-2">1. Executive Summary EBA (Risk & Gap Analysis)</h3>
                <div className="grid grid-cols-2 gap-6 mb-6">
                    <div className="border border-blue-200 p-5 rounded-lg bg-slate-50"><strong className="text-lg">Rischio Fisico:</strong> <span className={`font-bold ${eba.physicalRisk.score==='ALTO'?'text-red-600':'text-emerald-600'}`}>{eba.physicalRisk.score}</span><br/><span className="text-sm mt-2 block text-slate-600">{eba.physicalRisk.details.join(' ')}</span></div>
                    <div className="border border-blue-200 p-5 rounded-lg bg-slate-50"><strong className="text-lg">Rischio Transizione:</strong> <span className={`font-bold ${eba.transitionRisk.score==='ALTO'?'text-red-600':'text-emerald-600'}`}>{eba.transitionRisk.score}</span><br/><span className="text-sm mt-2 block text-slate-600">{eba.transitionRisk.details.join(' ')}</span></div>
                </div>
                {eba.gaps.length > 0 ? <div className="border border-orange-200 p-5 bg-orange-50/30 rounded-lg"><h4 className="font-bold text-lg mb-3">Gap Rilevati (Action Items):</h4><ul className="list-disc pl-6 text-base space-y-2">{eba.gaps.map((g,i)=><li key={i} className={g.type==='critical'?'text-red-700 font-semibold':''}>{g.text}</li>)}</ul></div> : <p className="text-base font-bold text-emerald-700 border p-4 rounded bg-emerald-50">Nessun gap critico rilevato rispetto alle linee guida.</p>}
            </div>
        );

        const PdfSection_Governance = ({ data, calc }) => (
            <div className="pdf-page-break pdf-avoid-break">
                <h3 className="font-bold text-2xl border-b-4 border-blue-900 text-blue-900 mb-6 pb-2">2. Profilo Aziendale & Governance</h3>
                <div className="space-y-3 text-sm">
                    <p><strong>Opzione Rendicontazione:</strong> {data.b1.option}</p>
                    <p><strong>Base Rendicontazione:</strong> {data.b1.reportingBasis}</p>
                    {data.b1.reportingBasis === 'Consolidata' && data.b1.subsidiaries.length > 0 && (
                        <div className="pl-4 mt-2"><strong>Filiali Incluse:</strong><ul className="list-disc text-sm pl-5 mt-1">{data.b1.subsidiaries.map(sub => <li key={sub.id}>{sub.name} - {sub.address}</li>)}</ul></div>
                    )}
                    <p><strong>Forma Giuridica:</strong> {data.b1.legalForm || 'N/D'}</p>
                    <p><strong>NACE:</strong> {data.b1.naceCodes.length ? data.b1.naceCodes.map(n => n.code).join(', ') : 'N/D'}</p>
                    <p><strong>Fatturato Globale:</strong> € {fmtInt(calc.globalRev)}</p>
                    <p><strong>Totale Attivo:</strong> € {fmtInt(data.b1.balanceSheetTotal)}</p>
                    <p><strong>FTE:</strong> {fmt(calc.total_fte, 2)}</p>
                </div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Certificazioni di Sostenibilità (Art. 25)</h4>
                {data.b1.certifications && data.b1.certifications.length > 0 ? (
                    <ul className="list-disc pl-5 text-sm space-y-1">{data.b1.certifications.map(c => <li key={c.id}><strong>{c.name}</strong> ({c.issuer}) - Data: {c.date ? new Date(c.date).toLocaleDateString() : 'N/D'} - Score: {c.score || 'N/D'}</li>)}</ul>
                ) : <PdfEmptyState />}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Informazioni Riservate e Omissioni (Par. 19)</h4>
                {data.b1.omittedInfo && data.b1.omittedInfo.isOmitted === 'Sì' ? (
                    <div className="p-3 bg-orange-50 border border-orange-200 text-sm"><strong>Dichiarazione:</strong> {data.b1.omittedInfo.details}</div>
                ) : <p className="text-sm border-l-4 border-emerald-500 pl-3 py-1 bg-slate-50">Nessuna informazione materiale omessa per ragioni di riservatezza.</p>}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Diversità CdA (Modulo C9)</h4>
                {calc.boardTotal > 0 ? <p className="text-sm"><strong>Gender Diversity Ratio:</strong> {fmt(calc.board_diversity_ratio)}% (Donne: {fmtInt(data.c9.boardMembersFemale)} / Uomini: {fmtInt(data.c9.boardMembersMale)})</p> : <PdfEmptyState/>}</div>
                
                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Condotta Aziendale (Modulo B11)</h4>
                {data.b11.hasIncidents === 'No' ? <p className="text-sm border-l-4 border-emerald-500 pl-3 py-1 bg-slate-50">Dichiarata assenza di condanne penali per corruzione o concussione.</p> : data.b11.hasIncidents === 'Sì' ? <div className="text-sm border-l-4 border-red-500 pl-3 py-2 bg-red-50"><p className="font-bold">Incidenti Registrati:</p><p>Condanne: {fmtInt(data.b11.corruptionConvictions)}</p><p>Ammontare Multe: € {fmtInt(data.b11.corruptionFines)}</p></div> : <PdfEmptyState />}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Ricavi Sensibili e Benchmark UE (Modulo C8)</h4>
                {(data.c8.revenueWeapons || data.c8.revenueTobacco || data.c8.revenueCoal || data.c8.revenueOil || data.c8.revenueGas) ? (
                    <><p className={`font-bold mb-2 ${calc.isExcludedFromBenchmarks ? 'text-red-600' : 'text-emerald-600'}`}>{calc.isExcludedFromBenchmarks ? 'ESCLUSO DAI BENCHMARK UE' : 'ELEGGIBILE BENCHMARK UE'}</p>
                    <table className="w-full text-xs border text-left"><thead className="bg-slate-100"><tr><th className="p-2">Attività</th><th className="p-2 text-right">Ricavo (€)</th><th className="p-2 text-right">Quota (%)</th></tr></thead><tbody><tr><td className="p-2 border-t">Armi (Soglia 0%)</td><td className="p-2 border-t text-right font-mono">{fmtInt(data.c8.revenueWeapons)}</td><td className="p-2 border-t text-right">{fmt(calc.pctWeapons, 2)}%</td></tr><tr><td className="p-2 border-t">Tabacco (Soglia 0%)</td><td className="p-2 border-t text-right font-mono">{fmtInt(data.c8.revenueTobacco)}</td><td className="p-2 border-t text-right">{fmt(calc.pctTobacco, 2)}%</td></tr><tr><td className="p-2 border-t">Carbone (Soglia 1%)</td><td className="p-2 border-t text-right font-mono">{fmtInt(data.c8.revenueCoal)}</td><td className="p-2 border-t text-right">{fmt(calc.pctCoal, 2)}%</td></tr><tr><td className="p-2 border-t">Petrolio/Gas (Soglia 10%)</td><td className="p-2 border-t text-right font-mono">{fmtInt(Number(data.c8.revenueOil)+Number(data.c8.revenueGas))}</td><td className="p-2 border-t text-right">{fmt(calc.pctOilGas, 2)}%</td></tr></tbody></table></>
                ) : <PdfEmptyState />}</div>
            </div>
        );

        const PdfSection_Environment = ({ data, calc }) => (
            <div className="pdf-page-break pdf-avoid-break">
                <h3 className="font-bold text-2xl border-b-4 border-emerald-700 text-emerald-800 mb-6 pb-2">3. Metriche Ambientali</h3>
                
                <h4 className="font-bold text-lg mb-3">Emissioni GHG (Modulo B3)</h4>
                {(calc.scope1 > 0 || calc.scope2_loc > 0 || calc.scope3_tot > 0) ? (
                    <div className="grid grid-cols-2 gap-4 text-sm mb-6"><div className="border p-3"><strong>Scope 1:</strong> {fmt(calc.scope1)} tCO2e</div><div className="border p-3"><strong>Scope 2 (Loc):</strong> {fmt(calc.scope2_loc)} tCO2e</div><div className="border p-3"><strong>Scope 2 (Mkt):</strong> {fmt(calc.scope2_mkt)} tCO2e</div><div className="border p-3"><strong>Scope 3:</strong> {fmt(calc.scope3_tot)} tCO2e</div></div>
                ) : <PdfEmptyState />}

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Piano Transizione e Target GHG (Modulo C3)</h4>
                {(data.c3.targets.length > 0 || data.c3.transitionPlanStatus) ? (
                    <div className="space-y-3 text-sm">
                        <p><strong>Settore Alto Impatto:</strong> {data.c3.isHighImpactSector || 'N/D'} | <strong>Stato Piano:</strong> {data.c3.transitionPlanStatus || 'N/D'}</p>
                        {data.c3.targets.length > 0 && <table className="w-full text-xs mt-2"><thead className="bg-slate-100"><tr><th className="p-2">Scope</th><th className="p-2 text-center">Anno Base</th><th className="p-2 text-center">Target</th><th className="p-2 text-center">Riduzione</th></tr></thead><tbody>{data.c3.targets.map(t=><tr key={t.id} className="border-t"><td className="p-2">{t.scope}</td><td className="p-2 text-center">{t.baseYear}</td><td className="p-2 text-center">{t.targetYear}</td><td className="p-2 text-center font-bold text-emerald-600">-{t.reductionPct}%</td></tr>)}</tbody></table>}
                    </div>
                ) : <PdfEmptyState />}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Inquinanti Atmosferici e Acquatici (Modulo B4)</h4>
                {data.b4.isMaterial === 'Sì' ? (
                    <div className="text-sm">
                        {data.b4.isDataPublic === 'Sì' ? <p><strong>Dati pubblici consultabili al link:</strong> <PdfSmartLink url={data.b4.pollutantsUrl} /></p> : (
                            data.b4.pollutantsList.length > 0 ? <table className="w-full text-xs border text-left"><thead className="bg-slate-100"><tr><th className="p-2">Sostanza</th><th className="p-2 text-center">Mezzo</th><th className="p-2 text-right">Quantità</th></tr></thead><tbody>{data.b4.pollutantsList.map(p=><tr key={p.id}><td className="p-2 border-t">{p.name}</td><td className="p-2 border-t text-center">{p.medium}</td><td className="p-2 border-t text-right font-mono">{fmt(p.amount)} {p.unit}</td></tr>)}</tbody></table> : <PdfEmptyState />
                        )}
                    </div>
                ) : data.b4.isMaterial === 'No' ? <p className="text-sm italic">Inquinamento considerato non materiale per il settore servizi (Esenzione Par. 69).</p> : <PdfEmptyState />}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Risorse Idriche (Modulo B6)</h4>
                {calc.waterTotalWithdrawal > 0 ? <table className="w-full text-xs border text-left"><thead className="bg-slate-100"><tr><th className="p-2">Sito</th><th className="p-2 text-right">Prelievo (m³)</th><th className="p-2 text-right">Scarico (m³)</th><th className="p-2 text-right">Consumo (m³)</th></tr></thead><tbody>{data.b1.sites.map(s=>{const w = data.b6.sitesWater[s.id]||{ stressLevel: 'Basso (<10%)' }; const c = Math.max(0, (w.withdrawal||0)-(w.discharge||0)); return <tr key={s.id}><td className="p-2 border-t">{s.name} {(w.stressLevel === 'Alto (40-80%)' || w.stressLevel === 'Estremo (>80%)')&&'(Stress Idrico)'}</td><td className="p-2 border-t text-right font-mono">{fmt(w.withdrawal)}</td><td className="p-2 border-t text-right font-mono">{fmt(w.discharge)}</td><td className="p-2 border-t text-right font-mono font-bold">{fmt(c)}</td></tr>})}</tbody></table> : <PdfEmptyState/>}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Rifiuti ed Economia Circolare (Modulo B7)</h4>
                {data.b7.onlyDomesticWaste ? <p className="text-sm">Esenzione: Esclusivamente rifiuti urbani/domestici.</p> : calc.b7_totalWaste > 0 ? <p className="text-sm"><strong>Rifiuti Totali:</strong> {fmt(calc.b7_totalWaste)} t | <strong>Riciclati:</strong> {fmt(calc.b7_totalRecycled)} t | <strong>Smaltiti:</strong> {fmt(calc.b7_totalDisposed)} t | <strong>Circolarità:</strong> {fmt(calc.b7_circularityRate)}%</p> : <PdfEmptyState />}</div>
                
                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Biodiversità e Uso del Suolo (Modulo B5)</h4>
                {(data.b5.landUse.sealedArea > 0 || data.b5.landUse.natureAreaInside > 0) ? <p className="text-sm"><strong>Area Sigillata:</strong> {fmtInt(data.b5.landUse.sealedArea)} m² | <strong>Aree Sensibili tracciate:</strong> {Object.values(data.b5.sitesBiodiversity).filter(b=>b.sensitiveAreaType!=='Nessuna').length}</p> : <PdfEmptyState/>}</div>

                <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Rischi Climatici TCFD (Modulo C4)</h4>
                {(data.c4.physicalRisksList.length > 0 || data.c4.transitionRisksList.length > 0) ? <p className="text-sm">Registrati {data.c4.physicalRisksList.length} Rischi Fisici e {data.c4.transitionRisksList.length} Rischi di Transizione. Metodologia: {data.c4.assessmentMethodology || 'Non specificata'}.</p> : <PdfEmptyState/>}</div>
            </div>
        );

        const PdfSection_Social = ({ data, calc }) => {
            const policyLabels = { childLabor: 'Lavoro minorile', forcedLabor: 'Lavoro forzato', trafficking: 'Tratta di esseri umani', discrimination: 'Discriminazione', incidentPrevention: 'Prevenzione degli incidenti' };
            const incidentLabels = { childLabor: 'Lavoro minorile', forcedLabor: 'Lavoro forzato', trafficking: 'Tratta di esseri umani', discrimination: 'Discriminazione' };
            return (
                <div className="pdf-page-break pt-10 pdf-avoid-break">
                    <h3 className="font-bold text-2xl border-b-4 border-orange-600 text-orange-700 mb-6 pb-2">4. Forza Lavoro e Aspetti Sociali</h3>
                    <h4 className="font-bold text-lg mb-3">Tipologia Contratto e Diversità (Modulo B8, C5)</h4>
                    {calc.b8_total_headcount > 0 ? (
                        <div className="space-y-4">
                            <table className="w-full text-sm border-collapse"><thead><tr className="border-b bg-slate-100"><th className="p-2 text-left">Tipo</th><th className="p-2 text-right">FT</th><th className="p-2 text-right">PT</th><th className="p-2 text-right">Totale</th></tr></thead><tbody><tr className="border-b"><td className="p-2">T. Indeterminato</td><td className="p-2 text-right">{fmtInt(data.b8.permanent_ft)}</td><td className="p-2 text-right">{fmtInt(data.b8.permanent_pt)}</td><td className="p-2 text-right font-bold">{fmtInt(Number(data.b8.permanent_ft)+Number(data.b8.permanent_pt))}</td></tr><tr className="border-b"><td className="p-2">T. Determinato</td><td className="p-2 text-right">{fmtInt(data.b8.temporary_ft)}</td><td className="p-2 text-right">{fmtInt(data.b8.temporary_pt)}</td><td className="p-2 text-right font-bold">{fmtInt(Number(data.b8.temporary_ft)+Number(data.b8.temporary_pt))}</td></tr><tr className="bg-slate-50"><td className="p-2 font-bold">Totale Dipendenti</td><td className="p-2 text-right font-bold">{fmtInt(calc.b8_full_time)}</td><td className="p-2 text-right font-bold">{fmtInt(calc.b8_part_time)}</td><td className="p-2 text-right font-black">{fmtInt(calc.b8_total_headcount)}</td></tr></tbody></table>
                            <p className="text-sm"><strong>Lavoratori Esterni (C5):</strong> {fmtInt(calc.c5_totalExternal)} | <strong>Rapporto Dirigenti (D:U):</strong> {calc.c5_managementRatio}</p>
                        </div>
                    ) : <PdfEmptyState />}
                    
                    <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Salute, Sicurezza e Retribuzione (Moduli B9, B10)</h4>
                    {(calc.b9_injury_rate > 0 || calc.b10_cbaCoveragePct > 0 || data.b10.minimumWage) ? (
                        <div className="grid grid-cols-2 gap-4 text-sm"><div className="border p-3"><strong>Tasso Infortuni (TRIR):</strong> {fmt(calc.b9_injury_rate, 2)}<br/><strong>Decessi (Infortuni/Malattie):</strong> {fmtInt(data.b9.fatalitiesInjuries)} / {fmtInt(data.b9.fatalitiesIllHealth)}</div><div className="border p-3"><strong>Copertura Sindacale:</strong> {fmt(calc.b10_cbaCoveragePct, 1)}%<br/><strong>Gender Pay Gap:</strong> {calc.b10_isPayGapExempt && data.b10.hourly_rate_male === 0 ? "Esente" : `${fmt(calc.pay_gap_pct)}%`}</div></div>
                    ) : <PdfEmptyState />}</div>

                    <div className="mt-6 pt-4 border-t border-slate-300"><h4 className="font-bold text-lg mb-3">Diritti Umani e Incidenti (Moduli C6, C7)</h4>
                    {data.c6.humanRightsPolicy || data.c7.incidents !== 'No' ? (
                        <div className="grid grid-cols-2 gap-4 text-sm"><div className="border p-3"><strong>Policy in essere:</strong> {data.c6.humanRightsPolicy}<br/>{data.c6.humanRightsPolicy === 'Sì' && (<ul className="list-disc pl-5 mt-1 text-xs">{Object.keys(data.c6.policyTopics).filter(k=>k!=='other' && data.c6.policyTopics[k]).map(k => <li key={k}>{policyLabels[k]}</li>)}{data.c6.policyTopics.other && <li>Altro: {data.c6.policyOtherDetails}</li>}</ul>)}<br/><strong>Reclamo (Whistleblowing):</strong> {data.c6.grievanceMechanism}</div><div className="border p-3"><strong>Incidenti (Interni):</strong> {data.c7.incidents}<br/>{data.c7.incidents === 'Sì' && (<ul className="list-disc pl-5 mt-1 text-xs">{Object.keys(data.c7.incidentTypes).filter(k=>k!=='other' && data.c7.incidentTypes[k]).map(k => <li key={k}>{incidentLabels[k]}</li>)}{data.c7.incidentTypes.other && <li>Altro: {data.c7.incidentOtherDetails}</li>}</ul>)}<br/><strong>Incidenti Catena Valore:</strong> {data.c7.valueChainIncidents}</div></div>
                    ) : <PdfEmptyState />}</div>
                </div>
            );
        };

        const PdfSection_Strategy = ({ data }) => (
            <div className="pdf-page-break pt-10 pdf-avoid-break">
                <h3 className="font-bold text-2xl border-b-4 border-slate-700 text-slate-800 mb-6 pb-2">5. Modello di Business e Strategia (Modulo C1)</h3>
                {(!data.c1.productsAndServices && !data.c1.markets && !data.c1.valueChain && !data.c1.esgStrategy) ? <PdfEmptyState /> : (
                    <div className="space-y-6"><div><strong className="text-lg">Prodotti e Servizi:</strong><p className="text-sm border border-slate-200 bg-slate-50 p-4 mt-2 rounded">{data.c1.productsAndServices || 'N/D'}</p></div><div><strong className="text-lg">Mercati:</strong><p className="text-sm border border-slate-200 bg-slate-50 p-4 mt-2 rounded">{data.c1.markets || 'N/D'}</p></div><div><strong className="text-lg">Catena del Valore:</strong><p className="text-sm border border-slate-200 bg-slate-50 p-4 mt-2 rounded">{data.c1.valueChain || 'N/D'}</p></div><div><strong className="text-lg">Strategia ESG:</strong><p className="text-sm border border-slate-200 bg-slate-50 p-4 mt-2 rounded">{data.c1.esgStrategy || 'N/D'}</p></div></div>
                )}
            </div>
        );

        /* PDF REGISTRY: Orchestrazione Poka-Yoke della stampa */
        const PDF_REGISTRY = { eba: PdfSection_EBA, gov: PdfSection_Governance, env: PdfSection_Environment, soc: PdfSection_Social, strat: PdfSection_Strategy };

        const PdfReportTemplate = ({ data, calc, eba, layoutTheme }) => {
            const th = { corporate: { bg: "bg-white", text: "text-slate-900" } }[layoutTheme] || { bg: "bg-white", text: "text-slate-900" };
            return (
                <div id="pdf-report-content" className={`p-10 ${th.bg} ${th.text} min-h-screen font-sans`}>
                    <PdfCoverPage data={data} calc={calc} />
                    <PdfTableOfContents />
                    {PDF_REGISTRY['eba']({ eba, calc, data })}
                    {PDF_REGISTRY['gov']({ data, calc })}
                    {PDF_REGISTRY['env']({ data, calc })}
                    {PDF_REGISTRY['soc']({ data, calc })}
                    {PDF_REGISTRY['strat']({ data, calc })}
                </div>
            );
        };

        /* =========================================================
           MAIN APP (Routing e Contesto)
           ========================================================= */
        const App = () => {
            const { data, updateData, updateScope3, loadJson, saveJson } = useAppModel();
            const { calc, eba, errors } = useControllers(data);
            const [activeTab, setActiveTab] = useState('b1');
            const [pdfLayout, setPdfLayout] = useState('corporate');
            
            // Applichiamo il nostro Custom Hook per la navigazione EFRAG
            const { guideKey, setGuideKey, guideBack, currentGuide, isSubTopic } = useEfragGuidance(activeTab, VSME_GUIDANCE);

            const handleNativePrint = () => {
                setTimeout(() => window.print(), 300); // Leggero delay per garantire il render del DOM
            };

            const modules = {
                'Generali': ['b1', 'b2_c2', 'c1'],
                'Ambiente': ['b3', 'b4', 'b5', 'b6', 'b7', 'c3', 'c4'],
                'Sociale': ['b8', 'b9', 'b10', 'c5', 'c6', 'c7'],
                'Governance': ['b11', 'c8', 'c9']
            };

            return (
                <GuidanceContext.Provider value={{ guideKey, setGuideKey }}>
                    <div className="flex h-screen bg-slate-100 font-sans relative">
                        <div id="app-ui-container" className="flex w-full h-full">
                            {/* ── Left nav ── */}
                            <div className="w-64 bg-blue-950 text-slate-300 flex flex-col shrink-0 shadow-xl z-20">
                                <div className="p-5 font-bold text-white text-lg flex items-center gap-3 border-b border-blue-900"><div className="bg-blue-600 p-1.5 rounded"><Leaf size={18}/></div> VSME Suite</div>
                                <nav className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4 mt-2">
                                    {Object.entries(modules).map(([cat, mods]) => (
                                        <div key={cat}>
                                            <h4 className="text-[10px] uppercase tracking-wider text-blue-400 font-bold mb-1 ml-2">{cat}</h4>
                                            <div className="space-y-0.5">
                                                {mods.map(m => <button key={m} onClick={()=>setActiveTab(m)} className={`w-full text-left px-3 py-1.5 text-xs rounded transition ${activeTab===m?'bg-blue-600 text-white font-bold':'hover:bg-blue-900 hover:text-white'}`}>Mod. {m.toUpperCase()}</button>)}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="pt-4 border-t border-blue-900">
                                        <button onClick={()=>setActiveTab('bank')} className={`w-full text-left px-3 py-2 text-sm rounded flex gap-2 transition ${activeTab==='bank'?'bg-blue-500 text-white font-bold':'hover:bg-blue-900 hover:text-white'}`}><Landmark size={16}/> Cruscotto EBA</button>
                                    </div>
                                </nav>
                            </div>
                            {/* ── Main content ── */}
                            <div className="flex-1 flex flex-col min-w-0">
                                <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm z-10">
                                    <h1 className="font-bold text-slate-700">
                                        {data.meta.companyName || 'Nuova Azienda'} - {data.meta.projectName} ({calc.referenceYear})
                                    </h1>
