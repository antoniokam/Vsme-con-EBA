                                    <div className="flex items-center gap-2">
                                        <label className="cursor-pointer flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-slate-50 hover:bg-slate-100 rounded border"><Upload size={14}/> Carica JSON<input type="file" className="hidden" accept=".json" onChange={loadJson}/></label>
                                        <button onClick={saveJson} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-slate-50 hover:bg-slate-100 rounded border"><Save size={14}/> Salva JSON</button>
                                        <div className="flex bg-blue-950 rounded p-1 ml-2">
                                            <select className="bg-transparent text-white text-xs pl-2 pr-6 outline-none cursor-pointer" value={pdfLayout} onChange={e=>setPdfLayout(e.target.value)}><option value="corporate" className="text-black">Corporate</option></select>
                                            <button onClick={handleNativePrint} className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 hover:bg-blue-500 transition-colors"><Printer size={12}/> Stampa PDF</button>
                                        </div>
                                    </div>
                                </header>
                                <main className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                                    <div className="max-w-4xl mx-auto">
                                        {activeTab === 'bank' ? <BankViews eba={eba} calc={calc} /> : <VsmeSectionWrapper sectionKey={activeTab} data={data} upd={updateData} updScope3={updateScope3} fullData={data} calc={calc} errors={errors} />}
                                    </div>
                                </main>
                            </div>
                            {/* ── Right guidance panel ── */}
                            <div className="w-80 bg-blue-950 shrink-0 shadow-2xl z-20 flex flex-col text-blue-100">
                                <div className="px-6 pt-6 pb-3 border-b border-blue-800 flex items-center gap-2">
                                    {isSubTopic && (
                                        <button onClick={guideBack} className="flex items-center gap-1 text-blue-400 hover:text-white text-xs font-bold mr-1 transition-colors" title="Torna indietro">
                                            ← 
                                        </button>
                                    )}
                                    <BookOpen className="text-blue-400 shrink-0" size={20}/>
                                    <h3 className="font-bold text-white text-sm">Guida EFRAG</h3>
                                    {isSubTopic && <span className="ml-auto text-[10px] bg-blue-700 text-blue-200 px-2 py-0.5 rounded-full">Campo</span>}
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-6">
                                    <div className="animate-fadeIn" key={guideKey}>
                                        <h4 className="text-blue-400 font-bold text-xs uppercase tracking-wider mb-3">{currentGuide?.title || 'Info'}</h4>
                                        <p className="text-sm leading-relaxed mb-6 whitespace-pre-wrap text-blue-100/90">{currentGuide?.text || 'Seleziona un modulo o clicca una ⓘ per dettagli sul campo.'}</p>
                                        {currentGuide?.eba && (
                                            <div className="bg-blue-900/50 p-4 rounded-lg border border-blue-800">
                                                <h5 className="text-sky-400 text-xs font-bold uppercase mb-2 flex items-center gap-1"><Search size={14}/> Lente Banca (EBA)</h5>
                                                <p className="text-xs leading-relaxed text-blue-200">{currentGuide.eba}</p>
                                            </div>
                                        )}
                                        {isSubTopic && (
                                            <button onClick={guideBack} className="mt-6 w-full flex items-center justify-center gap-2 text-xs font-semibold text-blue-300 hover:text-white border border-blue-700 hover:border-blue-500 rounded-lg py-2 transition-colors">
                                                ← Torna alla guida del modulo
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="pdf-render-container"><PdfReportTemplate data={data} calc={calc} eba={eba} layoutTheme={pdfLayout} /></div>
                    </div>
                </GuidanceContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
