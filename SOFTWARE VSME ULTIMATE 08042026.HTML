    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* =========================================================
           STILI PER STAMPA NATIVA (Native PDF Generation)
           ========================================================= */
        @media screen { #pdf-render-container { display: none; } }
        @media print {
            @page { margin: 15mm; }
            body { background: white; margin: 0; padding: 0; font-size: 10pt; color: #000; }
            #app-ui-container { display: none !important; }
            #pdf-render-container { display: block; width: 100%; position: relative; }
            .pdf-page-break { page-break-before: always; }
            .pdf-avoid-break { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            /* Print Specific Typography */
            h1, h2, h3, h4, h5 { page-break-after: avoid; }
            table { page-break-inside: auto; border-collapse: collapse; width: 100%; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { border: 1px solid #e2e8f0; padding: 6px; }
            th { background-color: #f8fafc !important; font-weight: bold; }
        }
    </style>

<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;
        const { 
            Leaf, Calculator, BookOpen, Upload, Save, Info, Settings, Zap, Users, Factory, 
            AlertCircle, Printer, ChevronDown, CheckCircle2, Truck, Box, Recycle, Coins, 
            Building, ShieldAlert, Target, Landmark, FileSpreadsheet, Activity, Search, X, 
            MapPin, Plus, Trash2, ExternalLink, Flame, Car, Globe, Droplets, Droplet, 
            Briefcase, RefreshCw, AlertTriangle, Layers, Target: TargetIcon, Crosshair,
            Award, ShieldOff, FileText
        } = window.LucideReact;

        /* =========================================================
           HELPER & CONSTANTS
           ========================================================= */
        const fmt = (value, decimals = 1) => {
            if (value === undefined || value === null || isNaN(value)) return "0";
            return Number(value).toLocaleString('it-IT', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        };
        const fmtInt = (value) => fmt(value, 0);

        const GuidanceContext = createContext({ guideKey: 'b1', setGuideKey: () => {} });
        const useGuidance = () => useContext(GuidanceContext);
        const InfoButton = ({ topic }) => {
            const { setGuideKey } = useGuidance();
            return (
                <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setGuideKey(topic); }} className="inline-flex items-center justify-center ml-1 text-blue-400 hover:text-blue-600 transition-colors focus:outline-none print:hidden" title="Clicca per info">
                    <Info size={16} />
                </button>
            );
        };

        const LEGAL_FORMS = ["Impresa a responsabilità limitata (Srl, SpA)", "Ditta individuale", "Partnership / Società di persone (Snc, Sas)", "Cooperativa", "Altro"];
        const SENSITIVE_AREA_TYPES = ["Nessuna", "Rete Natura 2000", "Patrimonio dell'Umanità UNESCO", "Key Biodiversity Area (KBA)", "Lista Rossa IUCN", "Altra area protetta"];
        const POLLUTANTS_PRESETS = ["Aria - Ossidi di Azoto (NOx)", "Aria - Ossidi di Zolfo (SOx)", "Aria - Particolato (PM10 / PM2.5)", "Aria - Ammoniaca (NH3)", "Acqua - Domanda Chimica Ossigeno (COD)", "Acqua - Domanda Biochimica Ossigeno (BOD)", "Acqua - Metalli Pesanti", "Suolo - Metalli Pesanti (Fanghi)", "Altro (Specifica manualmente...)"];
        const WASTE_PRESETS = { 'non-hazardous': ["Rifiuti urbani indifferenziati", "Imballaggi in carta e cartone (15 01 01)", "Imballaggi in plastica (15 01 02)", "Imballaggi in legno (15 01 03)", "Vetro (15 01 07)", "Metalli (15 01 04)", "Altro non pericoloso..."], 'hazardous': ["Oli esauriti / Lubrificanti (13 02*)", "Batterie al piombo (16 06 01*)", "Amianto (17 09 03*)", "Apparecchiature elettroniche WEEE (20 01 35*)", "Vernici e solventi (08 01 11*)", "Altro pericoloso / radioattivo..."] };

        // Dizionario Livelli Stress Idrico EFRAG > WRI Aqueduct
        const STRESS_LEVELS = ['Basso (<10%)', 'Medio-Basso (10-20%)', 'Medio-Alto (20-40%)', 'Alto (40-80%)', 'Estremo (>80%)'];

        const SCOPE3_CATEGORIES = [
            { id: 'cat1', label: '1. Beni e servizi acquistati', type: 'upstream', icon: <Box size={16}/>, volUnit: 'Tonn.', defaultSpendFactor: 0.45, defaultVolFactor: 2.5 },
            { id: 'cat2', label: '2. Beni strumentali', type: 'upstream', icon: <Factory size={16}/>, volUnit: 'Unità', defaultSpendFactor: 0.35, defaultVolFactor: 500 },
            { id: 'cat3', label: '3. Combustibili (WTT)', type: 'upstream', icon: <Zap size={16}/>, volUnit: 'kWh', defaultSpendFactor: 0.1, defaultVolFactor: 0.05 },
            { id: 'cat4', label: '4. Trasporti (Upstream)', type: 'upstream', icon: <Truck size={16}/>, volUnit: 'Tonn-km', defaultSpendFactor: 0.25, defaultVolFactor: 0.12 },
            { id: 'cat5', label: '5. Rifiuti generati', type: 'upstream', icon: <Recycle size={16}/>, volUnit: 'Tonn.', defaultSpendFactor: 0.05, defaultVolFactor: 21.29 },
            { id: 'cat6', label: '6. Viaggi di lavoro', type: 'upstream', icon: <Users size={16}/>, volUnit: 'km', defaultSpendFactor: 0.15, defaultVolFactor: 0.17 },
            { id: 'cat7', label: '7. Spostamento dipendenti', type: 'upstream', icon: <Users size={16}/>, volUnit: 'km', defaultSpendFactor: 0.0, defaultVolFactor: 0.14 },
            { id: 'cat8', label: '8. Leasing (Upstream)', type: 'upstream', icon: <Building size={16}/>, volUnit: 'Mesi', defaultSpendFactor: 0.2, defaultVolFactor: 50 },
            { id: 'cat9', label: '9. Trasporti (Downstream)', type: 'downstream', icon: <Truck size={16}/>, volUnit: 'Tonn-km', defaultSpendFactor: 0.25, defaultVolFactor: 0.12 },
            { id: 'cat10', label: '10. Lavorazione prodotti', type: 'downstream', icon: <Factory size={16}/>, volUnit: 'Tonn.', defaultSpendFactor: 0.3, defaultVolFactor: 1.5 },
            { id: 'cat11', label: '11. Uso dei prodotti', type: 'downstream', icon: <Zap size={16}/>, volUnit: 'kWh', defaultSpendFactor: 0.0, defaultVolFactor: 0.25 },
            { id: 'cat12', label: '12. Fine vita prodotti', type: 'downstream', icon: <Recycle size={16}/>, volUnit: 'Tonn.', defaultSpendFactor: 0.0, defaultVolFactor: 21.29 },
            { id: 'cat13', label: '13. Leasing (Downstream)', type: 'downstream', icon: <Building size={16}/>, volUnit: 'Mesi', defaultSpendFactor: 0.2, defaultVolFactor: 50 },
            { id: 'cat14', label: '14. Franchising', type: 'downstream', icon: <Building size={16}/>, volUnit: 'Negozi', defaultSpendFactor: 0.3, defaultVolFactor: 2000 },
            { id: 'cat15', label: '15. Investimenti', type: 'downstream', icon: <Coins size={16}/>, volUnit: '€ Mln', defaultSpendFactor: 0.5, defaultVolFactor: 50000 }
        ];

        const TOPICS_B2 = [{id: 'climate', l: 'Cambiamento Climatico'}, {id: 'pollution', l: 'Inquinamento'}, {id: 'water', l: 'Acqua e Risorse Marine'}, {id: 'biodiversity', l: 'Biodiversità'}, {id: 'circular', l: 'Economia Circolare'}, {id: 'workforce', l: 'Propria Forza Lavoro'}, {id: 'valueChain', l: 'Lavoratori Catena Valore'}, {id: 'communities', l: 'Comunità Colpite'}, {id: 'consumers', l: 'Consumatori/Utenti'}, {id: 'governance', l: 'Condotta Aziendale'}];
        const DEFAULT_FACTORS = { diesel_liters: 2.68787, petrol_liters: 2.31132, natural_gas_m3: 2.02266, lpg_liters: 1.55709, electricity_kwh_location: 0.25, electricity_kwh_market: 0.45 };
        SCOPE3_CATEGORIES.forEach(cat => { DEFAULT_FACTORS[`${cat.id}_spend`] = cat.defaultSpendFactor; DEFAULT_FACTORS[`${cat.id}_vol`] = cat.defaultVolFactor; });

        const VSME_GUIDANCE = {
            'b1': { title: "B1: Metadati e Basi per la preparazione", text: "Definisci il nome dell'azienda, periodo di rendicontazione (es. 01/01/2025 - 31/12/2025), perimetro e siti operativi.\n\n📌 Cosa inserire:\n• Nome azienda e forma giuridica (Srl, SpA, ecc.)\n• Date di inizio/fine del periodo di rendicontazione\n• Codice(i) NACE della tua attività principale\n• Ricavi e totale attivo (€)\n• Numero dipendenti totali\n• Lista siti operativi con indirizzo e coordinate GPS", eba: "Le banche valutano le geolocalizzazioni per mappare i Rischi Fisici degli immobili in portafoglio (es. rischio idrogeologico)." },
            'b2_c2': { title: "B2/C2: Strategia, Policy & Target", text: "Dichiara Pratiche, Politiche e Obiettivi per ogni tema ESG secondo i paragrafi 26 e 149.\n\n📌 Cosa inserire:\n• Spunta i temi ESG dove hai policy attive (B2)\n• Per il modulo C2, inserisci il testo della policy per ogni tema\n• Indica il responsabile ESG dell'azienda (C2 - accountability)\n• Specifica i target quantitativi dove disponibili", eba: "Le banche verificano la coerenza tra policy dichiarate e dati misurati nel report. Una policy senza dati a supporto è considerata 'greenwashing risk'." },
            'b3': { title: "B3: Scope 1 — Emissioni Dirette", text: "Le emissioni Scope 1 sono quelle generate direttamente dalla combustione di carburanti nelle tue attività.\n\n📌 Cosa inserire:\n• Combustibili per riscaldamento stazionario: inserisci i m³ di gas naturale consumati, litri di GPL o gasolio per caldaie\n• Combustibili per flotta aziendale: litri di diesel, benzina o GPL dei veicoli di proprietà\n\n💡 Fonte dati: fatture del fornitore di gas, schede carburante o sistema di fleet management.", eba: "Le emissioni Scope 1 sono il principale KPI per il calcolo dell'intensità carbonica (tCO2e/M€ ricavi) usata nel Green Asset Ratio bancario." },
            'b3_scope2': { title: "Scope 2: Emissioni Indirette da Elettricità", text: "Emissioni derivanti dall'energia elettrica acquistata e consumata.\n\n📌 Cosa inserire:\n• Elettricità Totale: tutti i kWh consumati nell'anno (vedi bollette)\n• Di cui Rinnovabile (GO): kWh coperti da Garanzie di Origine o contratto 100% rinnovabile\n\n🔁 Metodi di calcolo:\n• Location-Based: usa il mix della rete nazionale (fattore medio italiano ~0.25 kgCO2/kWh)\n• Market-Based: usa il fattore del tuo fornitore specifico (se hai contratto verde, può scendere a 0)\n\n💡 Se utilizzi un fornitore certificato, attiva il fattore personalizzato e inserisci il valore da certificato.", eba: "Le banche confrontano il metodo Location vs Market. Solo il Market-Based con GO certificate è accettato come 'zero emission' per il calcolo del PCAF." },
            'b3_scope3': { title: "Scope 3: Emissioni Catena del Valore", text: "Lo Scope 3 copre le emissioni nella catena del valore (fornitori, clienti, logistica, dipendenti).\n\n📌 Come compilare:\n• Attiva solo le categorie rilevanti per il tuo settore\n• Metodo Spend: inserisci la spesa (€) per quella categoria — più semplice ma meno preciso\n• Metodo Volume: inserisci la quantità fisica (tonnellate, km, kWh) — più accurato\n\n⚠️ Categorie spesso obbligatorie:\nCat. 1 (Acquisti) e Cat. 6 (Viaggi di lavoro) sono richieste per quasi tutti i settori.\nPer settori industriali, Cat. 4 (Trasporti) e Cat. 5 (Rifiuti) sono essenziali.\n\n💡 Puoi importare i fattori DEFRA aggiornati tramite il tasto apposito.", eba: "Lo Scope 3 può rappresentare fino al 90% delle emissioni totali. Le banche lo usano per valutare il rischio di transizione dell'intera filiera." },
            'b4': { title: "B4: Inquinanti Atmosferici e Acquatici", text: "Registro delle emissioni inquinanti (non GHG) rilasciate nell'ambiente.\n\n📌 Cosa inserire:\n• Materialità: Settori come servizi o uffici sono esentati.\n• Aria: NOx, SOx, polveri sottili (PM10, PM2.5), ammoniaca.\n• Acqua: COD, BOD, metalli pesanti, nitrati.\n• Suolo: Sversamenti o fanghi industriali." },
            'b5': { title: "B5: Biodiversità e Uso del Suolo", text: "Impatto fisico degli spazi aziendali sull'ecosistema.\n\n📌 Cosa inserire:\n• Per ogni sito: area totale in ettari e tipo di area sensibile circostante\n• Aree sensibili: Rete Natura 2000, UNESCO, KBA, Liste Rosse IUCN\n• Uso del suolo: superficie impermeabilizzata (parcheggi, edifici), aree naturali gestite dentro/fuori l'azienda\n\n💡 Verifica la prossimità a Natura 2000 sul portale EEA (link disponibile nel modulo).", eba: "La presenza di siti in aree Natura 2000 o KBA è un trigger automatico per la valutazione del rischio biodiversità nel PCAF e nell'EU Taxonomy." },
            'b6': { title: "B6: Risorse Idriche", text: "Gestione dell'acqua nei siti operativi.\n\n📌 Cosa inserire:\n• Prelievo (m³): acqua prelevata da rete, pozzi, ecc.\n• Scarico (m³): acqua reimmessa o in fognatura\n• Scarsità (Stress Idrico): seleziona la fascia di rischio del tuo sito.\n\n⚠️ Linee Guida EFRAG (Par. 91-93):\nUn'area è a 'forte stress idrico' se l'indicatore di stress di base supera il 40%.\nNel WRI Aqueduct, la soglia >40% scatta SOLO se l'indicatore 'Water Stress' è in fascia 'Alto (40-80%)' o 'Estremo (>80%)'. Assicurati di non confonderlo con l'indicatore 'Overall Water Risk'.", eba: "Il consumo idrico in zone ad alta scarsità (>40% WRI) è un KPI chiave per il rischio fisico climatico (drought risk) nel portafoglio bancario." },
            'b7': { title: "B7: Economia Circolare e Rifiuti", text: "Documenta la gestione dei rifiuti e la strategia circolare aziendale.\n\n📌 Cosa inserire:\n• Strategia circolare: descrivi le azioni di eliminazione, circolazione e rigenerazione dei materiali\n• Rifiuti: per ogni flusso inserisci tipologia (pericoloso/non pericoloso), quantità totale e quota avviata a recupero/riciclo\n• Flussi di massa: per settori manifatturieri, peso materie prime in entrata e prodotti in uscita\n\n⚠️ Il Tasso di Circolarità (% riciclato) viene calcolato automaticamente.", eba: "L'alta produzione di rifiuti pericolosi (>50t/anno) è un flag di attenzione nel credit risk assessment per rischio operativo e passività ambientali." },
            'hr': { title: "B8: Forza Lavoro — Headcount", text: "Matrice dei dipendenti disaggregata per tipo di contratto, genere e area geografica.\n\n📌 Cosa inserire:\n• Dipendenti Permanenti FT/PT e Temporanei FT/PT\n• FTE manuale: equivalente a tempo pieno calcolato\n• Headcount per genere (Uomini/Donne/Altro/Non dichiarato)\n• Headcount per Paese (se multi-sito internazionale)\n• Turnover: uscite volontarie nell'anno e headcount a inizio periodo\n\n⚠️ La somma dei contratti DEVE coincidere con la somma per genere.", eba: "Il Gender Ratio e il Turnover Rate sono KPI sociali monitorati dal CSRD e dall'EBA per la valutazione del rischio reputazionale e di governance." },
            'b8': { title: "B8: Forza Lavoro — Headcount", text: "Dati quantitativi sui dipendenti diretti.\n\n• Metodologia: Consigliato l'uso della media annua per gestire i lavoratori stagionali.\n• Disaggregazione: Richiesta suddivisione per genere e per Paese operativo.\n• FTE: Equivalente a tempo pieno. Parametro fondamentale per rapportare i dati sociali.\n• Turnover: Percentuale di dipendenti usciti rispetto all'organico. Obbligatorio sopra i 50 dipendenti." },
            'b9': { title: "B9: Salute e Sicurezza", text: "Metriche sugli infortuni e la sicurezza lavorativa.\n\n📌 Cosa inserire:\n• Numero infortuni registrabili (con e senza giorni persi)\n• Ore lavorate totali nell'anno (FTE × ~2.000 ore annue)\n• Decessi per infortuni e malattie professionali\n\n📊 Il sistema calcola automaticamente:\n• TRIR (Total Recordable Incident Rate) = (Infortuni × 200.000) / Ore lavorate\n\n💡 TRIR < 1.0 è considerato eccellente per la maggior parte dei settori industriali.", eba: "Un TRIR elevato o decessi sono red flag assoluti per i criteri ESG bancari e possono bloccare l'accesso a finanziamenti green." },
            'b10': { title: "B10: Retribuzioni e Formazione", text: "Equità salariale e sviluppo delle competenze.\n\n📌 Cosa inserire:\n• Retribuzione oraria media Uomini e Donne (base lorda €/h)\n• Dipendenti coperti da CCNL o contratto collettivo (numero)\n• Ore di formazione erogate per genere nell'anno\n• Dichiarazione sul salario minimo applicabile\n\n📊 Il Pay Gap viene calcolato automaticamente:\nGender Pay Gap (%) = (Uomini − Donne) / Uomini × 100\n\n⚠️ Esente se < 150 dipendenti (Par. VSME).", eba: "Il Gender Pay Gap > 5% è considerato un indicatore (KRI) sociale negativo, così come retribuzioni sotto la soglia minima." },
            'b11': { title: "B11: Condotta Aziendale", text: "Trasparenza su incidenti legali.\n\n📌 Cosa inserire:\n• Indica se ci sono stati incidenti di corruzione o concussione nel periodo\n• Se Sì: numero di condanne e ammontare sanzioni/multe (€)\n• La dichiarazione 'No incidenti' è valida e positivamente valutata\n\n✅ Risposta 'No incidenti': è un segnale forte di governance solida.\n⚠️ Condanne penali per corruzione: è un flag critico assoluto.", eba: "Condanne per corruzione o multe > €50.000 sono trigger automatici di esclusione da molti fondi ESG e prodotti bancari sostenibili." },
            'c1': { title: "C1: Modello di Business e Strategia", text: "Descrivi l'azienda, i suoi mercati e la strategia ESG complessiva.\n\n📌 Cosa inserire:\n• Prodotti/Servizi: cosa produce o offre l'azienda\n• Mercati: dove opera (nazionale/internazionale, B2B/B2C)\n• Catena del valore: principali fornitori e canali distributivi\n• Strategia ESG: visione e impegni di sostenibilità a lungo termine\n\n💡 Testo libero — scrivi in modo sintetico e misurabile (es. 'ridurre le emissioni del 30% entro 2030').", eba: "Le banche usano il C1 per valutare la 'strategicità' dell'ESG nel business model. Un'azienda senza strategia ESG articolata è classificata come 'non-aligned' al SFDR." },
            'c3': { title: "C3: Obiettivi GHG e Piano di Transizione", text: "Definisci target di riduzione delle emissioni e il piano di transizione climatica.\n\n📌 Cosa inserire:\n• Target GHG: % di riduzione, anno base, anno target, scope coperti\n• Azioni: interventi specifici (efficienza energetica, rinnovabili, elettrificazione flotta)\n• Settore ad alto impatto: dichiara se operi in settori NACE ad alta intensità carbonica\n• Piano di Transizione: stato di avanzamento (Formalizzato / In sviluppo / Non pianificato)\n\n💡 Il wizard suggerisce target SBTi-allineati in base ai dati B3 inseriti.", eba: "I target GHG allineati a SBTi o Paris Agreement sono un prerequisito per i Green Loan/Bond e per gli strumenti di finanziamento sostenibile (SLL, GLF)." },
            'c4': { title: "C4: Rischi Climatici (TCFD)", text: "Valuta i rischi fisici e di transizione secondo la metodologia TCFD.\n\n📌 Cosa inserire per ogni rischio:\n• Tipo: fisico (es. alluvione, siccità) o di transizione (es. carbon tax, obsolescenza)\n• Severità: Bassa / Media / Alta\n• Probabilità: Bassa / Media / Alta\n• Piano di adattamento: Sì / No / In sviluppo\n\n⚠️ Rischi 'Alto + No adattamento' vengono segnalati come gap critici nel cruscotto EBA.", eba: "La valutazione TCFD è obbligatoria per l'accesso ai prodotti Sustainability-Linked Loan e Green Bond Framework di molte banche europee." },
            'c5': { title: "C5: Forza Lavoro Addizionale", text: "Dichiara lavoratori esterni e composizione del management.\n\n📌 Cosa inserire:\n• Lavoratori autonomi/partite IVA stabili\n• Lavoratori tramite agenzia interinale\n• Manager Uomini e Donne (per il calcolo del Management Gender Ratio)\n\n📊 Management Ratio = Donne manager / Uomini manager\nUn ratio < 0.5 segnala squilibrio di genere nelle posizioni apicali.", eba: "L'alta percentuale di lavoro esterno (>50%) è un indicatore di instabilità della forza lavoro e rischio sociale secondo i criteri PAI (Principal Adverse Impact) SFDR." },
            'c6': { title: "C6: Policy Diritti Umani", text: "Dichiara l'esistenza e gli ambiti di copertura della policy sui diritti umani.\n\n📌 Cosa inserire:\n• Indica se l'azienda ha una policy formalizzata sui diritti umani\n• Se Sì: seleziona gli ambiti coperti (lavoro minorile, lavoro forzato, discriminazione, ecc.)\n• Meccanismo di reclamo: indica se esiste un canale whistleblowing o sistema di segnalazione\n\n💡 La policy deve coprire almeno la catena del valore diretta per essere considerata 'completa'.", eba: "L'assenza di policy diritti umani è un PAI obbligatorio da dichiarare nei prodotti Art. 8/9 SFDR. Il meccanismo di reclamo è richiesto dalla CSRD." },
            'c7': { title: "C7: Incidenti Diritti Umani", text: "Registra eventuali incidenti confermati relativi ai diritti umani.\n\n📌 Cosa inserire:\n• Indica se ci sono stati incidenti confermati nell'anno (Sì/No)\n• Se Sì: specifica il tipo (lavoro minorile, forzato, tratta, discriminazione)\n• Azioni di rimedio adottate (obbligatorio se Sì)\n• Incidenti nella catena del valore: fornitori o subappaltatori coinvolti\n\n⚠️ Lavoro minorile e forzato sono red flag assoluti per finanziamenti ESG.", eba: "Gli incidenti confermati su diritti umani sono PAI SFDR obbligatori e possono portare a exclusion screening da parte degli investitori istituzionali." },
            'c8': { title: "C8: Ricavi da Attività Controverse", text: "Monitora i ricavi da settori sensibili per verifica benchmark EU.\n\n📌 Cosa inserire:\n• Ricavi da armi controverse (€)\n• Ricavi da tabacco (€)\n• Ricavi da carbone termico (€)\n• Ricavi da petrolio e gas (€)\n• Ricavi da pesticidi/agrofarmaci controversi (€)\n\n⚠️ Soglie di esclusione dai Benchmark EU:\n- Armi controverse: qualsiasi importo → esclusione automatica\n- Tabacco: qualsiasi importo → esclusione\n- Carbone: > 1% ricavi totali\n- Petrolio/gas: > 10% ricavi totali", eba: "Il superamento delle soglie EBA/EU Taxonomy porta all'esclusione automatica dai Paris-Aligned Benchmark e dai Climate Transition Benchmark UE." },

        const useControllers = (data) => {

                const referenceYear = meta.periodEnd ? new Date(meta.periodEnd).getFullYear() : new Date().getFullYear();

                // GHG
                const s1_stat = ((energy.scope1.stationary.natural_gas_m3 * f.natural_gas_m3) + (energy.scope1.stationary.lpg_liters * f.lpg_liters) + (energy.scope1.stationary.diesel_liters * f.diesel_liters)) / 1000;
                const s1_mob = ((energy.scope1.mobile.diesel_liters * f.diesel_liters) + (energy.scope1.mobile.petrol_liters * f.petrol_liters) + (energy.scope1.mobile.lpg_liters * f.lpg_liters)) / 1000;
                const scope1 = s1_stat + s1_mob;
                const tot_kwh = Number(energy.electricity_kwh_total) || 0;
                let go_kwh = Number(energy.electricity_kwh_go) || 0;
                let scope2Error = go_kwh > tot_kwh;
                if (scope2Error) go_kwh = tot_kwh;
                const scope2_loc = (tot_kwh * f.electricity_kwh_location) / 1000;
                const active_mkt_factor = energy.use_custom_market_factor ? (Number(energy.custom_market_factor) || 0) : f.electricity_kwh_market;
                const scope2_mkt = ((tot_kwh - go_kwh) * active_mkt_factor) / 1000;

                SCOPE3_CATEGORIES.forEach(cat => {
                    const s3 = energy.scope3[cat.id];
                    if (s3.active) scope3_tot += ((s3.method === 'spend' ? s3.spend : s3.volume) * (s3.method === 'spend' ? f[`${cat.id}_spend`] : f[`${cat.id}_vol`])) / 1000;
                });
                const ghgTotalLoc = scope1 + scope2_loc + scope3_tot;
                const ghgTotalMkt = scope1 + scope2_mkt + scope3_tot;
                const ghgIntensity = b1.revenue > 0 ? (ghgTotalMkt / (b1.revenue / 1000000)) : 0;

                // Environment (Water, Waste)
                let waterTotalWithdrawal = 0, waterTotalDischarge = 0, waterTotalConsumption = 0;
                let waterStressWithdrawal = 0, waterStressConsumption = 0;

                    b1.sites.forEach(s => {

                        const cons = Math.max(0, (w.withdrawal || 0) - (w.discharge || 0));
                        waterTotalWithdrawal += (w.withdrawal || 0); waterTotalDischarge += (w.discharge || 0); waterTotalConsumption += cons;
                        
                        // Logica di valutazione rischio (EFRAG 40% threshold = Alto o Estremo su WRI)
                        const isHighStress = w.stressLevel === 'Alto (40-80%)' || w.stressLevel === 'Estremo (>80%)';
                        if(isHighStress) { waterStressWithdrawal += (w.withdrawal || 0); waterStressConsumption += cons; }
                    });

                const isMassFlowRequired = b1.naceCodes.some(n => { const c = n.code.toUpperCase().trim(); return c === 'C' || c === 'F' || c.startsWith('1') || c.startsWith('2') || c.startsWith('3') || c.startsWith('41') || c.startsWith('42') || c.startsWith('43') || c.startsWith('82.92'); });
                let b7_totalWaste = 0, b7_totalRecycled = 0, b7_totalDisposed = 0, b7_hazardousWaste = 0, b7_nonHazardousWaste = 0;

                const isExcludedFromBenchmarks = pctWeapons > 0 || pctTobacco > 0 || pctCoal >= 1 || pctOilGas >= 10;
                const boardTotal = Number(c9.boardMembersFemale) + Number(c9.boardMembersMale);
                const board_diversity_ratio = boardTotal > 0 ? (Number(c9.boardMembersFemale) / boardTotal) * 100 : 0;

                // EBA Dashboard Logic
                let physicalRisk = { score: "BASSO", color: "bg-green-100 text-green-800", details: [] };
                if (b5.landUse && b5.landUse.sealedArea > 10000) physicalRisk.details.push("Area impermeabilizzata estesa (>1ha).");
                if (b1.sites && b1.sites.length > 3) physicalRisk.details.push("Struttura multi-sito.");
                const hasSensitiveSites = Object.values(b5.sitesBiodiversity || {}).some(s => s.sensitiveAreaType && s.sensitiveAreaType !== "Nessuna");
                if (hasSensitiveSites) physicalRisk.details.push("Siti operativi in aree sensibili.");
                if (waterStressConsumption > 0) physicalRisk.details.push(`Consumo idrico in zone ad alto stress idrico (${fmt(waterStressConsumption)} m³).`);
                const highPhys = c4.physicalRisksList ? c4.physicalRisksList.filter(r => r.severity === 'Alto').length : 0;
                if (highPhys > 0) physicalRisk.details.push(`${highPhys} rischi fisici di livello Alto (C4).`);
                if (physicalRisk.details.length > 1 || highPhys > 0) { physicalRisk.score = "ALTO"; physicalRisk.color = "bg-red-100 text-red-800"; }
                else if (physicalRisk.details.length === 1) { physicalRisk.score = "MEDIO"; physicalRisk.color = "bg-orange-100 text-orange-800"; }

                let transitionRisk = { score: "BASSO", color: "bg-green-100 text-green-800", details: [] };
                if (fossil_rev_pct > 5) transitionRisk.details.push(`Ricavi fossili (${fmt(fossil_rev_pct)}%).`);
                if (pctWeapons > 0) transitionRisk.details.push(`Armi controverse.`);
                if ((!c3.targets || c3.targets.length === 0) && ghgTotalMkt > 500) transitionRisk.details.push("No target di riduzione GHG.");
                if (b7_hazardousWaste > 50) transitionRisk.details.push("Alta produzione di rifiuti pericolosi (>50t).");
                const highTrans = c4.transitionRisksList ? c4.transitionRisksList.filter(r => r.severity === 'Alto').length : 0;
                if (highTrans > 0) transitionRisk.details.push(`${highTrans} rischi di transizione di livello Alto (C4).`);
                if (transitionRisk.details.length > 1 || highTrans > 0) { transitionRisk.score = "ALTO"; transitionRisk.color = "bg-red-100 text-red-800"; }
                else if (transitionRisk.details.length === 1) { transitionRisk.score = "MEDIO"; transitionRisk.color = "bg-orange-100 text-orange-800"; }

                const gaps = [];
                if (!b1.naceCodes || b1.naceCodes.length === 0) gaps.push({ type: "critical", text: "Nessun Codice NACE specificato (B1)." });
                const hasUnmitigatedPhysical = c4.physicalRisksList?.some(r => r.severity === 'Alto' && r.adaptation === 'No');
                if (b1.option === 'Opzione B: Modulo base e modulo completo' && hasUnmitigatedPhysical) gaps.push({ type: "warning", text: "Rischi fisici Alti senza piano di adattamento (C4)." });
                if (!c5_isExempt && c5_externalPct > 50) gaps.push({ type: "warning", text: `Alta dipendenza da forza lavoro esterna (${fmt(c5_externalPct)}%). Rischio impatto sociale (C5).` });
                if (pay_gap_pct > 5 && !b10_isPayGapExempt) gaps.push({ type: "warning", text: `Gender Pay Gap oltre soglia tolleranza EBA (${fmt(pay_gap_pct)}%).` });
                if (b8_gender_diff > 0 || b8_country_diff > 0) gaps.push({ type: "warning", text: "Disallineamento nei totali della Forza Lavoro (Modulo B8)." });
                if (isTurnoverRequired && !isTurnoverCalculable) { gaps.push({ type: "critical", text: `Impossibile calcolare il Turnover: dati mancanti (B8).` }); } 
                else if (isTurnoverRequired && (!b8.turnoverLeavers || b8.turnoverLeavers <= 0)) gaps.push({ type: "warning", text: "Turnover non dichiarato nonostante la soglia (>50 dipendenti) (B8)." });
                if (b10.minimumWage === 'No') gaps.push({ type: "critical", text: "Presenza di dipendenti con retribuzione inferiore al salario minimo applicabile (Rischio Sociale B10)." });
                if (b11.hasIncidents === '') gaps.push({ type: "warning", text: "Dichiarazione su corruzione e condotta aziendale (B11) mancante." });
                if (b11.hasIncidents === 'Sì' && b11.corruptionConvictions > 0) gaps.push({ type: "critical", text: "Condanne per corruzione (B11)." });
                if (c3.isHighImpactSector === 'Sì' && (!c3.transitionPlanStatus || c3.transitionPlanStatus === 'Non pianificato')) gaps.push({ type: "warning", text: "Settore ad alto impatto senza Piano di Transizione Climatico (C3)." });
                if (c6.humanRightsPolicy === 'Sì' && !Object.values(c6.policyTopics).some(v => v === true)) gaps.push({ type: "warning", text: "Policy sui diritti umani dichiarata, ma nessun ambito specifico selezionato (C6)." });
                if (c6.grievanceMechanism === 'No') gaps.push({ type: "warning", text: "Assenza di un meccanismo di gestione dei reclami per i dipendenti (Governance C6)." });
                if (c7.incidents === 'Sì') {
                    if (c7.incidentTypes.childLabor || c7.incidentTypes.forcedLabor || c7.incidentTypes.trafficking) gaps.push({ type: "critical", text: "Gravi incidenti confermati sui diritti umani (Lavoro minorile/forzato/tratta) tra i dipendenti (C7)." });
                    if (!c7.remediationActions || c7.remediationActions.trim() === '') gaps.push({ type: "warning", text: "Incidenti confermati sui diritti umani senza azioni di rimedio dichiarate (C7)." });
                }
                if (c7.valueChainIncidents === 'Sì' && (!c7.valueChainDetails || c7.valueChainDetails.trim() === '')) gaps.push({ type: "warning", text: "Incidenti nella catena del valore segnalati ma non dettagliati (C7)." });
                if (isExcludedFromBenchmarks) gaps.push({ type: "critical", text: "Ricavi da attività sensibili (Armi/Tabacco/Fossili) oltre le soglie tollerate. Escluso dai Benchmark UE di Transizione (C8)." });

                return {
                    calc: { 
                        referenceYear, 
                        scope1, s1_stat, s1_mob, scope2_loc, scope2_mkt, scope3_tot, ghgTotalLoc, ghgTotalMkt, ghgIntensity, 
                        b8_full_time, b8_part_time, b8_total_headcount, b8_gender_diff, b8_country_diff, isTurnoverRequired, averageHeadcount, calculatedTurnoverRate, isTurnoverCalculable, missingHeadcountStart, total_fte, 
                        b9_injury_rate, b10_isPayGapExempt, b10_cbaCoveragePct, b10_avgTrainingMale, b10_avgTrainingFemale, pay_gap_pct,
                        c5_isExempt, c5_totalExternal, c5_externalPct, c5_managementRatio,
                        globalRev, pctWeapons, pctTobacco, pctCoal, pctOilGas, pctChemicals, fossil_rev_pct, isExcludedFromBenchmarks,
                        board_diversity_ratio, boardTotal,
                        waterTotalWithdrawal, waterTotalDischarge, waterTotalConsumption, waterStressWithdrawal, waterStressConsumption,
                        b7_totalWaste, b7_totalRecycled, b7_totalDisposed, b7_hazardousWaste, b7_nonHazardousWaste, b7_circularityRate, isMassFlowRequired
                    },
                    eba: { physicalRisk, transitionRisk, gaps },
                    errors: { scope2Error }
                };
            }, [data]);
        };

        /* =========================================================
           CUSTOM HOOKS (Architettura Modulare)
           ========================================================= */
        const useEfragGuidance = (activeTab, guidanceDict) => {
            const [guideKey, setGuideKeyRaw] = useState('b1');
            const [guideHistory, setGuideHistory] = useState([]);

            const setGuideKey = useCallback((key) => {
                if (!guidanceDict[key]) return;
                setGuideKeyRaw(prev => { setGuideHistory(h => [...h, prev]); return key; });
            }, [guidanceDict]);

            const guideBack = useCallback(() => {
                setGuideHistory(prev => {
                    if (prev.length === 0) return prev;
                    const h = [...prev]; const last = h.pop();
                    setGuideKeyRaw(last);
                    return h;
                });
            }, []);

            useEffect(() => {
                const defaultKey = activeTab === 'b8' ? 'hr' : (guidanceDict[activeTab] ? activeTab : 'b1');
                setGuideKeyRaw(defaultKey);
                setGuideHistory([]);
            }, [activeTab, guidanceDict]);

            const currentGuide = guidanceDict[guideKey];
            const isSubTopic = guideHistory.length > 0;

            return { guideKey, setGuideKey, guideBack, currentGuide, isSubTopic };
        };

        const useDefraImport = (onApply) => {
            const [state, setState] = useState('idle'); // idle | loading | preview | error
            const [preview, setPreview] = useState({});
            const [errorMsg, setErrorMsg] = useState('');

            const parseDefraExcel = (file, onResult) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const wb = XLSX.read(e.target.result, { type: 'array' });
                        const found = {};
                        const strategies = [
                            { colLabel: [0,1,2], colUnit: 3, colValue: 4 },
                            { colLabel: [0,1], colUnit: 2, colValue: 5 },
                            { colLabel: [0,1], colUnit: 2, colValue: 4 },
                        ];
                        const normalize = (s) => String(s || '').toLowerCase().trim();
                        const MATCHERS = [
                            { key: 'diesel_liters', tests: [(l,u) => l.includes('diesel') && (u.includes('litre') || u.includes('liter') || u.includes('l)') || u==='l')] },
                            { key: 'petrol_liters', tests: [(l,u) => (l.includes('petrol') || l.includes('gasoline')) && (u.includes('litre') || u.includes('liter') || u.includes('l)') || u==='l')] },
                            { key: 'lpg_liters', tests: [(l,u) => l.includes('lpg') && (u.includes('litre') || u.includes('liter') || u.includes('l)') || u==='l')] },
                            { key: 'natural_gas_m3', tests: [(l,u) => (l.includes('natural gas') || l.includes('gas, natural')) && (u.includes('m3') || u.includes('cubic') || u==='m³')] },
                            { key: 'electricity_kwh_location', tests: [(l,u) => l.includes('electric') && !l.includes('renewable') && (u.includes('kwh') || u.includes('kw.h'))] },
                        ];

                        wb.SheetNames.forEach(sheetName => {
                            if (Object.keys(found).length >= 5) return;
                            const ws = wb.Sheets[sheetName];
                            if (!ws) return;
                            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

                            for (const strat of strategies) {
                                rows.forEach(row => {
                                    if (!row || row.length < Math.max(...strat.colLabel, strat.colUnit, strat.colValue) + 1) return;
                                    const label = strat.colLabel.map(i => normalize(row[i])).join(' ');
                                    const unit  = normalize(row[strat.colUnit]);
                                    const raw   = row[strat.colValue];
                                    const val   = parseFloat(String(raw).replace(',', '.'));
                                    if (!val || isNaN(val) || val <= 0 || val > 50) return;

                                    MATCHERS.forEach(({ key, tests }) => {
                                        if (found[key]) return;
                                        if (tests.some(t => t(label, unit))) found[key] = +val.toFixed(5);
                                    });
                                });
                            }
                        });
                        onResult({ ok: true, found });
                    } catch(err) {
                        onResult({ ok: false, error: err.message });
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleFile = useCallback((e) => {
                const file = e.target.files[0];
                if (!file) return;
                setState('loading');
                parseDefraExcel(file, (res) => {
                    if (!res.ok) { setState('error'); setErrorMsg(res.error); return; }
                    if (Object.keys(res.found).length === 0) { 
                        setState('error'); 
                        setErrorMsg('Nessun fattore riconosciuto. Verifica che il file sia il DEFRA ufficiale.'); 
                        return; 
                    }
                    setPreview(res.found); 
                    setState('preview');
                });
                e.target.value = '';
            }, []);

            const confirmImport = useCallback(() => { 
                onApply(preview); 
                setState('idle'); 
                setPreview({}); 
            }, [onApply, preview]);

            const cancelImport = useCallback(() => { 
                setState('idle'); 
                setPreview({}); 
            }, []);

            return { state, preview, errorMsg, handleFile, confirmImport, cancelImport };
        };

        /* =========================================================
           UI COMPONENTS (Reusable)
           ========================================================= */
        const Input = ({ label, value, type="text", unit, onChange, error, placeholder, disabled=false }) => {
            const [localVal, setLocalVal] = useState("");
            useEffect(() => {
                if (type === 'number') {
                    const externalVal = Number(value) || 0;
                    const plainLocal = localVal.replace(/\./g, '').replace(',', '.');
                    const parsedLocal = parseFloat(plainLocal) || 0;
                    if (externalVal !== parsedLocal && localVal !== "") setLocalVal(externalVal === 0 ? "" : externalVal.toLocaleString('it-IT', { maximumFractionDigits: 5 }));
                    else if (localVal === "" && externalVal !== 0) setLocalVal(externalVal.toLocaleString('it-IT', { maximumFractionDigits: 5 }));
                } else setLocalVal(value || "");
            }, [value, type]);

            const handleChange = (e) => {
                if (type === 'number') {
                    let val = e.target.value;
                    if (val === "") { setLocalVal(""); onChange(0); return; }
                    val = val.replace(/[^0-9.,]/g, '');
                    let plainStr = val.replace(/\./g, '');
                    const parts = plainStr.split(',');
                    if (parts.length > 2) plainStr = parts[0] + ',' + parts.slice(1).join('');
                    let [intPart, decPart] = plainStr.split(',');
                    if (intPart.length > 1 && intPart.startsWith('0')) { intPart = intPart.replace(/^0+/, ''); if (intPart === '') intPart = '0'; }
                    if (intPart) intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                    let formatted = decPart !== undefined ? `${intPart},${decPart}` : intPart;
                    setLocalVal(formatted); 
                    let num = parseFloat(plainStr.replace(',', '.'));
                    if (!isNaN(num)) onChange(num);
                } else { setLocalVal(e.target.value); onChange(e.target.value); }
            };

            const handleBlur = () => { if (type === 'number' && localVal.endsWith(',')) setLocalVal(localVal.slice(0, -1)); };

            return (
                <div className="mb-4">
                    {label && <label className="flex items-center text-xs font-semibold text-slate-600 mb-1">{label}</label>}
                    <div className="relative">
                        <input type={type === 'number' ? 'text' : type} inputMode={type === 'number' ? 'decimal' : 'text'} placeholder={placeholder} 
                            className={`w-full bg-slate-50 border rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500 ${error ? 'border-red-500' : 'border-slate-300'} ${disabled ? 'opacity-50 cursor-not-allowed bg-slate-200' : ''}`} 
                            value={localVal} onChange={handleChange} onBlur={handleBlur} disabled={disabled} />
                        {unit && <span className="absolute right-3 top-2 text-xs text-slate-400 font-bold">{unit}</span>}
                    </div>
                    {error && <p className="text-xs text-red-600 mt-1">{error}</p>}
                </div>
            );
        };

        const Select = ({ label, value, options, onChange }) => (
            <div className="mb-4">
                <label className="flex items-center text-xs font-semibold text-slate-600 mb-1">{label}</label>
                <select className="w-full bg-slate-50 border border-slate-300 rounded-md p-2 text-sm focus:ring-blue-500" value={value || ""} onChange={e => onChange(e.target.value)}>
                    <option value="">Seleziona...</option>{options.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
            </div>
        );

        const Textarea = ({ label, value, onChange, placeholder }) => (
            <div className="mb-4 col-span-full">
                {label && <label className="flex items-center text-xs font-semibold text-slate-600 mb-1">{label}</label>}
                <textarea placeholder={placeholder} className="w-full bg-slate-50 border border-slate-300 rounded-md p-3 text-sm min-h-[100px] focus:ring-blue-500 custom-scrollbar resize-y" value={value || ""} onChange={e => onChange(e.target.value)} />
            </div>
        );

        const NaceManager = ({ naceCodes, onChange }) => {
            const [val, setVal] = useState('');
            const handleAdd = () => {
                const codeToAdd = val.trim();
                if (codeToAdd && !naceCodes.find(n => n.code === codeToAdd)) {

            return (

                        <div className="flex flex-wrap gap-2 mb-2">
                            {naceCodes.map(n => <span key={n.code} className="inline-flex items-center gap-1 px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold border border-blue-200">{n.code} <X size={14} className="cursor-pointer hover:text-blue-900" onClick={() => onChange(naceCodes.filter(x => x.code !== n.code))}/></span>)}
                        </div>
                        <div className="flex gap-2">
                            <input type="text" placeholder="Digita il codice (es. C - Manifattura)" className="flex-1 bg-slate-50 border border-slate-300 rounded-md p-2 text-sm focus:ring-blue-500" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleAdd()}}/>

            const geoRegex = /^-?\d{1,3}\.\d{5,},\s*-?\d{1,3}\.\d{5,}$/;
            return (
                <div className="col-span-full mb-6">
                    <div className="flex justify-between items-center mb-3">

                    </div>
                    <div className="border border-slate-200 rounded-lg overflow-x-auto shadow-sm">
                        <table className="w-full text-sm text-left">

                            </thead>
                            <tbody>
                                {sites.map(s => {

                                    const query = isValidGeo ? s.coordinates.replace(/\s/g, '') : encodeURIComponent(`${s.address} ${s.city} ${s.country}`);
                                    const mapLink = `https://www.google.com/maps/search/?api=1&query=${query}`;

                                                <div className="flex gap-1">

                                                <a href={mapLink} target="_blank" rel="noreferrer" className="text-[10px] flex items-center gap-1 font-bold text-blue-600 hover:text-blue-800 transition-colors bg-blue-50 px-2 py-1 rounded inline-block w-max"><MapPin size={12}/> {isValidGeo ? 'Test Coordinate' : 'Cerca su Maps'}</a>

                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

            const removeRow = (id) => onChange(items.filter(i => i.id !== id));

            return (

                    </div>
                    <div className="border border-slate-200 rounded-lg overflow-x-auto shadow-sm">

                                        </td>
                                        <td className="p-2 align-top"><select value={p.medium} onChange={e=>updateRow(p.id, 'medium', e.target.value)} className="w-full p-1.5 border rounded text-xs bg-slate-50"><option value="Aria">Aria</option><option value="Acqua">Acqua</option><option value="Suolo">Suolo</option></select></td>
                                        <td className="p-2 align-top"><input type="text" inputMode="decimal" value={p.amount === 0 ? '' : fmt(p.amount, 5).replace(/\./g,'').replace(',', '.')} onChange={e=>{ let val = e.target.value.replace(/[^0-9.]/g, ''); updateRow(p.id, 'amount', parseFloat(val) || 0); }} className="w-full p-1.5 border rounded text-xs bg-slate-50" placeholder="0"/></td>
                                        <td className="p-2 align-top"><select value={p.unit} onChange={e=>updateRow(p.id, 'unit', e.target.value)} className="w-full p-1.5 border rounded text-xs bg-slate-50"><option value="kg">kg</option><option value="t">t</option></select></td>
                                        <td className="p-2 text-center align-top"><button onClick={() => onChange(items.filter(i => i.id !== p.id))} className="text-slate-400 hover:text-red-500 mt-1"><Trash2 size={16}/></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const CoworkingWizard = ({ sites, onApply }) => {
            const [bldWater, setBldWater] = useState(1296);
            const [bldEmp, setBldEmp] = useState(100);
            const [bldDays, setBldDays] = useState(240);
            const [ownEmp, setOwnEmp] = useState(25);
            const [ownDays, setOwnDays] = useState(220);
            const [selectedSite, setSelectedSite] = useState(sites.length > 0 ? sites[0].id : "");
            const estimatedM3 = (bldWater / (bldEmp * bldDays)) * ownEmp * ownDays || 0;

            return (
                <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-5 mb-6 shadow-sm">
                    <div className="flex items-center gap-2 mb-4 border-b border-indigo-200 pb-2"><Calculator size={18} className="text-indigo-700"/><h4 className="font-bold text-sm text-indigo-900">Wizard Uffici Condivisi (Par. 79)</h4></div>
                    <div className="grid grid-cols-5 gap-4 mb-4">
                        <div className="col-span-1"><Input label="Acqua Edificio (m³)" type="number" value={bldWater} onChange={setBldWater}/></div>
                        <div className="col-span-1"><Input label="Dip. Edificio" type="number" value={bldEmp} onChange={setBldEmp}/></div>
                        <div className="col-span-1"><Input label="Giorni Edif." type="number" value={bldDays} onChange={setBldDays}/></div>

                            </select>
                            <button onClick={() => selectedSite && onApply(selectedSite, estimatedM3)} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded font-bold" disabled={!selectedSite}>Applica</button>
                        </div>
                    </div>
                </div>
            );
        };

        const WasteManager = ({ items, onChange }) => {
            const addRow = (type) => onChange([...items, { id: Date.now(), type, name: "", customName: "", total: 0, recycled: 0, disposed: 0, unit: "t" }]);
            const removeRow = (id) => onChange(items.filter(i => i.id !== id));
            const updateRow = (id, field, value) => {
                onChange(items.map(w => {
                    if (w.id !== id) return w;
                    let updated = { ...w, [field]: value };
                    if (field === 'total' || field === 'recycled') updated.disposed = Math.max(0, (Number(updated.total) || 0) - (Number(updated.recycled) || 0));
                    return updated;
                }));
            };

            const renderTable = (type, title, icon, colorClass, btnClass) => (
                <div className={`border rounded-lg overflow-x-auto shadow-sm ${type==='hazardous'?'border-red-200 mt-6':'border-slate-200'}`}>

                        <button onClick={() => addRow(type)} className={`text-xs px-3 py-1 rounded font-bold flex items-center gap-1 bg-white border ${btnClass}`}><Plus size={14}/> Aggiungi</button>
                    </div>

                        <thead className={`text-xs ${type==='hazardous'?'text-red-500 bg-white':'text-slate-500 bg-slate-50'}`}><tr><th className="p-3">Categoria</th><th className="p-3 w-32">Totale</th><th className="p-3 w-32">Riciclato</th><th className="p-3 w-32">Smaltito (Auto)</th><th className="p-3 w-20">Unità</th><th className="w-10"></th></tr></thead>

                                <tr key={w.id} className="border-b bg-white">

                                            <option value="">Seleziona...</option>{WASTE_PRESETS[type].map(o => <option key={o} value={o}>{o}</option>)}
                                        </select>
                                        {w.name.includes('Altro') && <input type="text" placeholder="Specifica..." value={w.customName} onChange={e=>updateRow(w.id, 'customName', e.target.value)} className="w-full p-1.5 border rounded text-xs mt-1"/>}
                                    </td>
                                    <td className="p-2"><input type="number" min="0" step="any" value={w.total || ''} onChange={e=>updateRow(w.id, 'total', Number(e.target.value))} className="w-full p-1.5 border rounded text-xs bg-slate-50" placeholder="0"/></td>
                                    <td className="p-2"><input type="number" min="0" step="any" value={w.recycled || ''} onChange={e=>updateRow(w.id, 'recycled', Number(e.target.value))} className={`w-full p-1.5 border rounded text-xs ${w.recycled > w.total ? 'bg-red-50 border-red-400 text-red-700' : 'bg-emerald-50 border-emerald-200'}`} placeholder="0"/></td>
                                    <td className="p-3 font-mono font-bold text-slate-500 bg-slate-50/50">{fmt(w.disposed, 2)}</td>
                                    <td className="p-2"><select value={w.unit} onChange={e=>updateRow(w.id, 'unit', e.target.value)} className="w-full p-1.5 border rounded text-xs bg-slate-50"><option value="t">t</option><option value="kg">kg</option><option value="m³">m³</option></select></td>
                                    <td className="p-2 text-center"><button onClick={()=>removeRow(w.id)} className="text-slate-400 hover:text-red-500"><Trash2 size={16}/></button></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );

            return (<div>{renderTable('non-hazardous', 'Rifiuti Non Pericolosi (Par. 105)', <Recycle size={16}/>, 'text-slate-700', 'border-slate-300 text-slate-700')}{renderTable('hazardous', 'Rifiuti Pericolosi (Par. 96-102)', <AlertTriangle size={16}/>, 'text-red-800', 'border-red-200 text-red-700')}</div>);
        };

        const MassFlowManager = ({ items, onChange }) => {
            const addRow = () => onChange([...items, { id: Date.now(), material: "", amount: 0, unit: "t" }]);
            const removeRow = (id) => onChange(items.filter(i => i.id !== id));
            const updateRow = (id, field, value) => onChange(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            return (
                <div className="border border-slate-200 rounded-lg overflow-x-auto shadow-sm mt-4">
                    <div className="bg-slate-100 p-3 border-b flex justify-between items-center">

                            {items.map(m => (
                                <tr key={m.id} className="border-b bg-white">
                                    <td className="p-2"><input type="text" placeholder="Es. Acciaio..." value={m.material} onChange={e=>updateRow(m.id, 'material', e.target.value)} className="w-full p-1.5 border rounded text-xs"/></td>
                                    <td className="p-2"><input type="number" min="0" step="any" value={m.amount || ''} onChange={e=>updateRow(m.id, 'amount', Number(e.target.value))} className="w-full p-1.5 border rounded text-xs bg-slate-50"/></td>
                                    <td className="p-2"><select value={m.unit} onChange={e=>updateRow(m.id, 'unit', e.target.value)} className="w-full p-1.5 border rounded text-xs bg-slate-50"><option value="t">t</option><option value="kg">kg</option><option value="m³">m³</option></select></td>
                                    <td className="p-2 text-center"><button onClick={()=>removeRow(m.id)} className="text-slate-400 hover:text-red-500"><Trash2 size={16}/></button></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const C3TargetManager = ({ targets, onChange, onAutoFillB3 }) => {
            const addTarget = () => onChange([...targets, { id: Date.now(), scope: "Scope 1", baseYear: new Date().getFullYear() - 1, baseValue: 0, reductionPct: 0, targetYear: 2030, coveragePct: 100 }]);
            const removeTarget = (id) => onChange(targets.filter(t => t.id !== id));

            return (
                <div className="border border-slate-200 rounded-lg overflow-x-auto shadow-sm mt-2 mb-6">

                                        <td className="p-2"><input type="number" step="any" value={t.baseValue||''} onChange={e=>updateTarget(t.id, 'baseValue', Number(e.target.value))} className="w-full p-1 border rounded text-xs bg-slate-50 text-right"/></td>
                                        <td className="p-2 relative"><input type="number" min="0" max="100" value={t.reductionPct||''} onChange={e=>updateTarget(t.id, 'reductionPct', Number(e.target.value))} className="w-full p-1 border border-indigo-300 rounded text-xs bg-indigo-50/30 font-bold text-center"/><span className="absolute right-3 top-2.5 text-[10px] opacity-50">%</span></td>
                                        <td className="p-2"><input type="number" value={t.targetYear||''} onChange={e=>updateTarget(t.id, 'targetYear', Number(e.target.value))} className="w-full p-1 border rounded text-xs bg-slate-50" placeholder="YYYY"/></td>
                                        <td className="p-2 text-right font-mono font-bold text-indigo-700 bg-indigo-50/30">{fmt(targetValue, 1)}</td>
                                        <td className="p-2 relative"><input type="number" min="0" max="100" value={t.coveragePct||''} onChange={e=>updateTarget(t.id, 'coveragePct', Number(e.target.value))} className="w-full p-1 border rounded text-xs bg-slate-50 text-center"/><span className="absolute right-3 top-2.5 text-[10px] opacity-50">%</span></td>
                                        <td className="p-2 text-center"><button onClick={()=>removeTarget(t.id)} className="text-slate-400 hover:text-red-500"><Trash2 size={14}/></button></td>

            const updateRow = (id, val) => onChange(items.map(i => i.id === id ? { ...i, description: val } : i));
            return (

                    </div>

            const removeRow = (id) => onChange(items.filter(i => i.id !== id));
            const updateRow = (id, field, value) => onChange(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            return (
                <div className="border rounded-lg overflow-x-auto mb-6 bg-white shadow-sm">
                    <div className={`p-3 border-b flex justify-between items-center bg-${color}-50 border-${color}-100`}>
                        <h4 className={`font-bold flex items-center gap-2 text-${color}-800`}><Icon size={16}/> {title}</h4>
                        <button onClick={addRow} className={`text-xs bg-white border px-3 py-1 rounded font-bold flex gap-1 border-${color}-200 text-${color}-800`}><Plus size={14}/> Aggiungi</button>

                        <tbody>
                            {items.map(r => (

                </div>

            const { setGuideKey } = useGuidance();
            const { state, preview, errorMsg, handleFile, confirmImport, cancelImport } = useDefraImport(onApply);

            const LABELS = {
                diesel_liters: 'Diesel (kgCO₂e/litro)',
                petrol_liters: 'Benzina (kgCO₂e/litro)',
                lpg_liters: 'GPL (kgCO₂e/litro)',
                natural_gas_m3: 'Gas Naturale (kgCO₂e/m³)',
                electricity_kwh_location: 'Elettricità rete (kgCO₂e/kWh)',
            };

            return (
                <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4">
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                            <FileSpreadsheet size={16} className="text-amber-600"/>
                            <span className="text-sm font-bold text-amber-800">Importa Fattori DEFRA</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <a href="https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2024" target="_blank" rel="noreferrer" className="text-xs font-semibold text-blue-600 hover:underline flex items-center gap-1"><ExternalLink size={12}/> Scarica da DEFRA</a>
                            <InfoButton topic="defra"/>
                        </div>
                    </div>
                    {state === 'idle' && (
                        <label className="cursor-pointer flex items-center gap-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded transition-colors w-fit">
                            <Upload size={13}/> Carica Excel DEFRA (.xlsx)
                            <input type="file" className="hidden" accept=".xlsx,.xls" onChange={handleFile}/>
                        </label>
                    )}
                    {state === 'loading' && <p className="text-xs text-amber-700 animate-pulse">⏳ Analisi del file in corso...</p>}
                    {state === 'error' && (
                        <div className="space-y-2">
                            <p className="text-xs text-red-700 bg-red-50 border border-red-200 rounded p-2">⚠️ {errorMsg}</p>
                            <label className="cursor-pointer flex items-center gap-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded transition-colors w-fit">
                                <Upload size={13}/> Riprova
                                <input type="file" className="hidden" accept=".xlsx,.xls" onChange={handleFile}/>
                            </label>
                        </div>
                    )}
                    {state === 'preview' && (
                        <div className="space-y-3">
                            <p className="text-xs font-semibold text-amber-700">✅ Rilevati {Object.keys(preview).length} fattori — verifica e conferma:</p>
                            <div className="bg-white rounded border border-amber-200 overflow-hidden">
                                {Object.entries(preview).map(([k, v]) => (
                                    <div key={k} className="flex justify-between items-center px-3 py-2 text-xs border-b last:border-0">
                                        <span className="text-slate-600">{LABELS[k] || k}</span>
                                        <span className="font-bold text-emerald-700">{v}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={confirmImport} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded transition-colors flex items-center gap-1"><CheckCircle2 size={13}/> Applica</button>
                                <button onClick={cancelImport} className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-2 rounded transition-colors">Annulla</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        /* =========================================================
           VIEW MODULES (MVVM Isolation)
           ========================================================= */
        const ModuleB1 = ({ d, meta, upd }) => (
            <div className="space-y-6">
                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-sm animate-fadeIn">
                    <h3 className="font-bold text-sm text-slate-800 mb-4 border-b pb-3 flex items-center gap-2">
                        <Building size={18} className="text-blue-600"/> 1. Basi per la Preparazione e Perimetro (Par. 24)
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <Input label="Ragione Sociale" type="text" value={meta.companyName} onChange={v=>upd('meta', 'companyName', v)} placeholder="Es. Mario Rossi S.p.A." />
                        <Input label="Data Inizio Periodo" type="date" value={meta.periodStart} onChange={v=>upd('meta', 'periodStart', v)} />
                        <Input label="Data Fine Periodo" type="date" value={meta.periodEnd} onChange={v=>upd('meta', 'periodEnd', v)} />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <Select label="Opzione Modulo VSME (Par. 24A)" value={d.option} options={["Opzione A: Modulo base", "Opzione B: Modulo base e modulo completo"]} onChange={v=>upd('b1', 'option', v)} />
                        <Select label="Base di rendicontazione (Par. 24C)" value={d.reportingBasis} options={["Individuale", "Consolidata"]} onChange={v=>upd('b1', 'reportingBasis', v)} />
                    </div>
                    {d.reportingBasis === 'Consolidata' && <SubsidiariesManager items={d.subsidiaries} onChange={v=>upd('b1', 'subsidiaries', v)} />}
                </div>

                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-sm animate-fadeIn">
                    <h3 className="font-bold text-sm text-slate-800 mb-4 border-b pb-3 flex items-center gap-2">
                        <Info size={18} className="text-blue-600"/> 2. Dati Base Aziendali (Par. 24E)
                    </h3>
                    <div className="grid grid-cols-2 gap-4 mb-4">
                        <Select label="Forma Giuridica" value={d.legalForm} options={LEGAL_FORMS} onChange={v=>upd('b1', 'legalForm', v)} />
                        <Input label="Fatturato Annuale Netto" type="number" unit="€" value={d.revenue} onChange={v=>upd('b1', 'revenue', v)} />
                        <Input label="Totale Attivo (Stato Patrimoniale)" type="number" unit="€" value={d.balanceSheetTotal} onChange={v=>upd('b1', 'balanceSheetTotal', v)} />
                        <Input label="Dipendenti Totali (Organico)" type="number" value={d.employees} onChange={v=>upd('b1', 'employees', v)} />
                    </div>
                    <NaceManager naceCodes={d.naceCodes} onChange={v=>upd('b1', 'naceCodes', v)} />
                    <SitesManager sites={d.sites} onChange={v=>upd('b1', 'sites', v)} />
                </div>

                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 shadow-sm animate-fadeIn">
                    <h3 className="font-bold text-sm text-slate-800 mb-2 border-b pb-3 flex items-center gap-2">
                        <Award size={18} className="text-blue-600"/> 3. Certificazioni di Sostenibilità (Art. 25)
                    </h3>
                    <p className="text-xs text-slate-500 mb-4">Qualora l'impresa abbia ottenuto certificazioni o etichette relative alla sostenibilità (es. EcoVadis, ISO 14001, B-Corp), fornirne una descrizione.</p>
                    <CertificationsManager items={d.certifications} onChange={v=>upd('b1', 'certifications', v)} />
                </div>

                <div className="bg-orange-50 p-5 rounded-lg border border-orange-200 shadow-sm animate-fadeIn">
                    <h3 className="font-bold text-sm text-orange-900 mb-2 border-b border-orange-200 pb-3 flex items-center gap-2">
                        <ShieldOff size={18} className="text-orange-600"/> 4. Omissioni e Informazioni Sensibili (Par. 19, 24B)
                    </h3>
                    <p className="text-xs text-orange-800 mb-4">Qualora la fornitura di informazioni richieda la divulgazione di informazioni classificate o sensibili, l'impresa può ometterle, dichiarando l'omissione.</p>
                    <div className="w-1/2">
                        <Select label="Ci sono state omissioni per riservatezza?" value={d.omittedInfo.isOmitted} options={["Sì", "No"]} onChange={v=>{ upd('b1', 'omittedInfo', {...d.omittedInfo, isOmitted: v}); if(v==='No') upd('b1', 'omittedInfo', {...d.omittedInfo, isOmitted: v, details: ""}); }} />
                    </div>
                    {d.omittedInfo.isOmitted === 'Sì' && (
                        <div className="mt-4 animate-fadeIn">
                            <Textarea label="Giustificazione / Informazioni omesse" value={d.omittedInfo.details} onChange={v=>upd('b1', 'omittedInfo', {...d.omittedInfo, details: v})} placeholder="Specifica quali dati sono stati omessi e la motivazione (es. segreto industriale)..." />
                        </div>
                    )}
                </div>
            </div>
        );

        const ModuleB2_C2 = ({ d_b2, d_c2, upd_b2, upd_c2 }) => (
            <div className="space-y-6">
                <div className="bg-slate-50 p-5 rounded-lg border border-slate-200">
                    <Input label="Responsabile apicale per l'attuazione delle politiche" placeholder="Es. Mario Rossi - Direttore Sostenibilità" value={d_c2.accountability} onChange={v => upd_c2('accountability', v)} />
                </div>
                <div className="border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-slate-100 border-b"><tr><th className="p-3">Tema ESG</th><th className="p-3 text-center">Pratiche / Politiche (B2)</th><th className="p-3 text-center">Obiettivi (B2)</th></tr></thead>
                        <tbody>
                            {TOPICS_B2.map(t => {
                                const hasPol = d_b2[t.id]?.practicePolicy; const hasTar = d_b2[t.id]?.target;
                                return (
                                    <React.Fragment key={t.id}>
                                        <tr className={`border-b ${hasPol||hasTar ? 'bg-blue-50/50' : 'hover:bg-slate-50'}`}>
                                            <td className="p-3 font-semibold text-slate-700">{t.l}</td>
                                            <td className="p-3 text-center"><input type="checkbox" checked={hasPol||false} onChange={e=>upd_b2(t.id, {...d_b2[t.id], practicePolicy: e.target.checked})} className="w-4 h-4"/></td>
                                            <td className="p-3 text-center"><input type="checkbox" checked={hasTar||false} onChange={e=>upd_b2(t.id, {...d_b2[t.id], target: e.target.checked})} className="w-4 h-4"/></td>
                                        </tr>
                                        {(hasPol||hasTar) && (
                                            <tr className="border-b bg-slate-50"><td colSpan="3" className="p-4 border-l-4 border-blue-500"><div className="grid grid-cols-2 gap-6">
                                                {hasPol && <Textarea label={`Policy - ${t.l}`} value={d_c2[`${t.id}Policy`]} onChange={v => upd_c2(`${t.id}Policy`, v)} />}
                                                {hasTar && <Textarea label={`Obiettivo - ${t.l}`} value={d_c2[`${t.id}Target`]} onChange={v => upd_c2(`${t.id}Target`, v)} />}
                                            </div></td></tr>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const ModuleB3 = ({ d, updEnergy, updScope3, updFactors, calc, errors }) => {
            const [tab, setTab] = useState('scope12');

            const handleDefraApply = (factors) => { updFactors(factors); };

            return (
                <div className="grid grid-cols-3 gap-6">
                    <div className="col-span-2">
                        <div className="flex gap-2 mb-4">
                            <button onClick={()=>setTab('scope12')} className={`px-3 py-1.5 rounded-md text-sm font-bold ${tab==='scope12'?'bg-blue-600 text-white':'bg-slate-100 text-slate-600'}`}>Scope 1 & 2</button>
                            <button onClick={()=>setTab('scope3')} className={`px-3 py-1.5 rounded-md text-sm font-bold ${tab==='scope3'?'bg-indigo-600 text-white':'bg-slate-100 text-slate-600'}`}>Wizard Scope 3</button>
                        </div>
                        {tab === 'scope12' ? (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="bg-slate-50 p-4 rounded border border-slate-200 shadow-sm">
                                    <h3 className="font-bold text-sm mb-4 text-slate-700 border-b pb-2 flex items-center justify-between"><span>Scope 1 (Dirette)</span> <InfoButton topic="b3" /></h3>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="bg-white p-3 rounded border border-slate-200">
                                            <h4 className="font-semibold text-xs text-slate-500 mb-3 uppercase flex items-center gap-1"><Flame size={14}/> Stazionaria</h4>
                                            <Input label="Gas Naturale" type="number" value={d.scope1.stationary.natural_gas_m3} unit="m³" onChange={v=>updEnergy('scope1', {...d.scope1, stationary: {...d.scope1.stationary, natural_gas_m3: v}})} />
                                            <Input label="GPL" type="number" value={d.scope1.stationary.lpg_liters} unit="Litri" onChange={v=>updEnergy('scope1', {...d.scope1, stationary: {...d.scope1.stationary, lpg_liters: v}})} />
                                            <Input label="Diesel" type="number" value={d.scope1.stationary.diesel_liters} unit="Litri" onChange={v=>updEnergy('scope1', {...d.scope1, stationary: {...d.scope1.stationary, diesel_liters: v}})} />
                                        </div>
                                        <div className="bg-white p-3 rounded border border-slate-200">
                                            <h4 className="font-semibold text-xs text-slate-500 mb-3 uppercase flex items-center gap-1"><Car size={14}/> Mobile (Flotta)</h4>
                                            <Input label="Diesel" type="number" value={d.scope1.mobile.diesel_liters} unit="Litri" onChange={v=>updEnergy('scope1', {...d.scope1, mobile: {...d.scope1.mobile, diesel_liters: v}})} />
                                            <Input label="Benzina" type="number" value={d.scope1.mobile.petrol_liters} unit="Litri" onChange={v=>updEnergy('scope1', {...d.scope1, mobile: {...d.scope1.mobile, petrol_liters: v}})} />
                                            <Input label="GPL" type="number" value={d.scope1.mobile.lpg_liters} unit="Litri" onChange={v=>updEnergy('scope1', {...d.scope1, mobile: {...d.scope1.mobile, lpg_liters: v}})} />
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-blue-50 p-4 rounded border border-blue-100 shadow-sm">
                                    <h3 className="font-bold text-sm mb-3 text-blue-800 border-b border-blue-200 pb-2 flex items-center">Scope 2 (Elettricità) <InfoButton topic="b3_scope2" /></h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <Input label="Elettricità Totale" type="number" value={d.electricity_kwh_total} unit="kWh" onChange={v=>updEnergy('electricity_kwh_total', v)} />
                                        <Input label="Di cui Rinnovabile (GO)" type="number" value={d.electricity_kwh_go} unit="kWh" onChange={v=>updEnergy('electricity_kwh_go', v)} error={errors.scope2Error ? "Supera totale" : null}/>
                                    </div>
                                    <div className="mt-2 pt-3 border-t border-blue-200/50">
                                        <label className="flex items-center text-sm cursor-pointer mb-3"><input type="checkbox" checked={d.use_custom_market_factor} onChange={e=>updEnergy('use_custom_market_factor', e.target.checked)} className="mr-2 rounded"/><span className="font-semibold text-blue-900">Usa fattore Market-Based specifico</span> <InfoButton topic="b3_scope2_custom" /></label>
                                        {d.use_custom_market_factor && <Input label="Fattore Fornitore" type="number" unit="kgCO2/kWh" value={d.custom_market_factor} onChange={v=>updEnergy('custom_market_factor', v)} />}
                                    </div>
                                </div>
                                <DefraImportPanel onApply={handleDefraApply} />
                            </div>
                        ) : (
                            <div className="h-[400px] overflow-y-auto custom-scrollbar pr-2 animate-fadeIn space-y-2">
                                <div className="flex items-center justify-between mb-3"><span className="text-sm font-bold text-indigo-800">Wizard Emissioni Indirette</span><InfoButton topic="b3_scope3" /></div>
                                {SCOPE3_CATEGORIES.map(cat => {
                                    const s3 = d.scope3[cat.id];
                                    return (
                                        <div key={cat.id} className={`p-3 border rounded-lg transition-colors ${s3.active?'bg-white border-indigo-300 shadow-sm':'bg-slate-50 border-slate-200'}`}>
                                            <div className="flex justify-between items-center cursor-pointer" onClick={()=>updScope3(cat.id, 'active', !s3.active)}>
                                                <div className="flex items-center gap-2">{cat.icon} <span className="font-bold text-sm text-slate-700">{cat.label}</span></div>
                                                <input type="checkbox" checked={s3.active} readOnly className="w-4 h-4 text-indigo-600 border-slate-300 rounded" />
                                            </div>
                                            {s3.active && (
                                                <div className="mt-3 pt-3 border-t grid grid-cols-2 gap-4">
                                                    <Select label="Metodo" value={s3.method} options={['spend', 'volume']} onChange={v=>updScope3(cat.id, 'method', v)} />
                                                    {s3.method === 'spend' ? <Input label="Spesa" type="number" unit="€" value={s3.spend} onChange={v=>updScope3(cat.id, 'spend', v)} /> : <Input label="Volume" type="number" unit={cat.volUnit} value={s3.volume} onChange={v=>updScope3(cat.id, 'volume', v)} />}
                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </div>
                    <div className="bg-slate-900 p-5 rounded-xl text-white shadow-xl flex flex-col">
                        <h3 className="text-center text-xs uppercase text-slate-400 mb-6 font-bold flex items-center justify-center gap-2"><Activity size={14}/> Cruscotto Audit</h3>
                        <div className="space-y-4 mb-6 flex-1">
                            <div className="border-b border-slate-700 pb-2"><div className="flex justify-between text-sm"><span className="text-blue-300 font-semibold">Scope 1</span><span className="font-bold">{fmt(calc.scope1)} t</span></div></div>
